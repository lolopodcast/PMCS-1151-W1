/* ============ 版權提示 Toast ============ */
var COPYRIGHT_MSG = 'Intellectual Property of Prof. Shihmin Lo';
var _cwToastTimer = null;
function showCopyrightToast(msg) {
  var el = document.getElementById('cw-toast');
  if (!el) return;
  el.innerHTML = DOMPurify.sanitize('&copy; ' + (msg || COPYRIGHT_MSG));
  el.classList.add('show');
  if (_cwToastTimer) clearTimeout(_cwToastTimer);
  _cwToastTimer = setTimeout(function () { el.classList.remove('show'); }, 2000);
}
window.showCopyrightToast = showCopyrightToast;

/* ============ 智慧型右鍵與快捷鍵攔截 ============ */
document.addEventListener('contextmenu', function (e) {
  var selection = (window.getSelection() ? window.getSelection().toString() : '').trim();
  var tag = e.target && e.target.tagName ? e.target.tagName.toUpperCase() : '';
  var isForm = (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT');
  if (isForm) return true;
  if (selection.length > 0) return true;   /* 有反白 → 允許（查字典 / 複製筆記） */
  e.preventDefault();
  showCopyrightToast();
});

document.addEventListener('keydown', function (e) {
  var k = (e.key || '').toLowerCase();
  if (e.key === 'F12') { e.preventDefault(); showCopyrightToast(); return; }
  if (e.ctrlKey && !e.shiftKey && k === 'u') { e.preventDefault(); showCopyrightToast(); return; }
  if (e.ctrlKey && e.shiftKey && ['i', 'j', 'c'].indexOf(k) !== -1) { e.preventDefault(); showCopyrightToast(); return; }
  /* Ctrl+P（列印）與 Ctrl+S（存檔）刻意開放，確保學生可離線複習 */
});

document.addEventListener('dragstart', function (e) {
  var tag = e.target && e.target.tagName ? e.target.tagName.toUpperCase() : '';
  if (tag === 'IMG' || (e.target.closest && e.target.closest('svg'))) e.preventDefault();
});

window.safeHTML = function (raw) {

};

    { front: 'PESTEL', back: '政治、經濟、社會、科技、環境、法律六個總體環境構面。用來檢查「有什麼我控制不了、但會改變我選項的東西」。' },
    { front: '三個構成要素', back: '家庭（你的背景與起點）、大學（課程與師資）、社會與產業（未來生活與職涯）。三者共同決定你能看見哪些路。' },
    { front: '為什麼先看世界', back: '因為「我喜歡什麼」單獨回答不了職涯問題。同一個興趣放在不同產業結構與不同十年，結果會完全不同。' }

  m1_wrapup: '這一節不要你記住 PESTEL 那六個字母。它要你換一個提問方式：不要只問「我想做什麼」，而要問「我想做的那件事，現在被什麼力量推著走」。這個問法會一路用到第十八週。',
  m1_q: [
    { q: '總體層級這一層，最主要在提醒你什麼？', opts: ['選課應優先考慮個人興趣', '學習與職涯不是個人選擇', '出國留學才會有國際競爭力', '大學排名決定職涯的高度'], ans: _A1, exp: '個人的成長並非孤立，而是嵌在社會變遷與全球競爭的脈絡之中。' },
    { q: '這一層的三個構成要素是哪三個？', opts: ['家庭、大學、社會與產業', '興趣、能力、性格與特質', '學費、學貸、政府獎助學金', '政治、經濟、社會與文化'], ans: _A0, exp: '家庭是起點，大學是現在所在，社會與產業是要去的地方。' },
    { q: 'PESTEL 指的是哪六個構面？', opts: ['產品、通路、價格、推廣、人、流程', '政治、經濟、社會、科技、環境、法律', '知識、技能、態度、經驗、人脈、證照', '策略、組織、流程、系統、文化、績效'], ans: _A1, exp: '六個總體環境構面，用來檢查你控制不了但會改變你選項的力量。' },
    { q: '「政府政策」在這張圖裡放在哪個位置？', opts: ['三個構成要素的最內圈', '完全在這張圖之外', '三要素與全球環境之間', '與家庭並列為第四要素'], ans: _A2, exp: '政策在三個構成要素外面、全球 PESTEL 裡面，是不問你意見卻改變你選項的一圈。' },
    { q: '這一節希望你改成什麼樣的提問方式？', opts: ['我想做什麼工作比較賺錢', '我該選哪一所學校比較好', '我想做的事被什麼推著走', '我的性格適合哪一種職業'], ans: _A2, exp: '從「我想做什麼」換成「我想做的那件事，現在被什麼力量推著走」。' }
  ],

  /* ---------- M2 Understand Industry ---------- */
  m2_nav: '2. Understand Industry',
  m2_title: 'Understand Industry：從產業一路走到一份 JD',
  m2_overview: '看完世界，把鏡頭拉近到產業。這一層有兩件事要弄清楚：產業長什麼樣子（分成哪幾類），以及一份工作是怎麼從產業一路被定義出來的。第二件事比第一件重要得多。',
  m2_highlights: ['一級產業', '二級產業', '三級產業', '新經濟', 'JD', '職能 = f(K, S, A)'],
  m2_p1: '產業分成四大類。**一級產業**處理原料：農林漁牧與礦業。**二級產業**做製造：把原料變成產品。**三級產業**是零售與服務：把產品與服務送到人手上。第四類是**新經濟**——數位產業與創業，它不太符合前三級的邏輯，因為它的產出常常不是實體的東西，而是一套機制。',
  m2_p2: '比分類更要緊的是這條鏈：**產業 → 企業 → 部門 → 職位 → 職務說明（JD）**。多數人找工作是從最右邊開始的——看到一則職缺，覺得還可以，就投了。但那則職缺之所以長那樣，是被左邊四層決定的。倒過來走一次，你才會知道這份工作到底在幹嘛、為什麼存在、以及五年後還會不會在。',
  m2_p3: '而你在大學裡累積的東西，最後要對應到 JD 上。對應的語言是這條式子：**Competency 職能（素養）= f(K 知識, S 技能, A 態度)**。一個人能不能勝任某個職位，看的不是單一項目，而是這三者組合出來的結果——這也是第七週「職能地圖」整週在做的事。JD 裡的每一條要求，多半都可以歸到 K、S、A 其中一類。知識與技能通常寫得明確、也查得到；態度最模糊、最難驗證，也因此最容易被寫成空話——這件事到第八週會變成一個專門的題目。',
  m2_p4: '這條鏈就是這門課期末專案的骨架。你們那個晨報 Agent 做的事情，本質上就是：大量抓取某個產業的職缺 JD，用 K、S、A 三類把它們拆開，然後回答「這個產業現在到底在找什麼樣的人」。所以這一節不是背景知識，是規格書。',
  m2_svg_cap: '四大類產業，以及從產業到職務說明的五層鏈',
  m2_terms: [
    { front: '四大類產業', back: '一級（原料）、二級（製造）、三級（零售與服務）、新經濟（數位產業與創業）。第四類的產出常常不是實體物件，而是一套機制。' },
    { front: '產業→企業→部門→職位→JD', back: '一份職缺長成那樣，是被左邊四層決定的。倒過來走一次，才會知道這份工作為什麼存在、五年後還在不在。' },
    { front: 'JD · Job Description', back: '職務說明。這條鏈的最右端，也是你把大學所學拿去對應的那份文件。期末專案要大量分析的，就是它。' },
    { front: 'Competency 職能（素養）', back: '職能 = f(K 知識, S 技能, A 態度)。能不能勝任一個職位，看的是三者組合出來的結果，不是單一項目。第七週的「職能地圖」整週在做這件事。' },
    { front: 'K / S / A', back: 'Knowledge 知識、Skills 技能、Attitude 態度。JD 裡的每一條要求多半歸得進這三類；K 與 S 明確可查，A 最模糊也最容易變成空話。' },
    { front: '新經濟', back: '數位產業與創業。它不太符合一二三級的邏輯，因為產出常常是一套機制或平台，而不是一件可以放在架上的東西。' }
  ],
  m2_wrapup: '這一節你只需要帶走一條鏈與一條式子：產業→企業→部門→職位→JD，以及職能 = f(K 知識, S 技能, A 態度)。它們不是名詞解釋，是你到第十週要拿來寫程式的資料結構。',
  m2_q: [
    { q: '四大類產業中，「新經濟」指的是什麼？', opts: ['原料開採與農林漁牧', '把原料加工成為產品', '數位產業與創業活動', '零售通路與服務業'], ans: _A2, exp: '它的產出常常是一套機制或平台，而不是實體物件，因此不太符合一二三級的邏輯。' },
    { q: '這一節說的那條鏈，正確順序是？', opts: ['職位→部門→企業→產業→JD', '產業→企業→部門→職位→JD', 'JD→職位→產業→企業→部門', '企業→產業→職位→部門→JD'], ans: _A1, exp: '由左而右逐層收斂，最右端才是你看到的那則職缺。' },
    { q: '為什麼要「倒過來」從產業看回職缺？', opts: ['因為投履歷前要先查公司背景', '因為職缺是被左邊四層決定的', '因為大公司的職缺相對比較穩定', '因為產業分析報告比較容易取得'], ans: _A1, exp: '倒推一次，才知道這份工作在幹嘛、為什麼存在、五年後還會不會在。' },
    { q: '職能（素養）在這門課裡怎麼定義？', opts: ['職能 = f(知識, 技能, 態度)', '職能 = f(學歷, 年資, 證照)', '職能 = f(興趣, 性向, 人格)', '職能 = f(薪資, 職級, 年齡)'], ans: _A0, exp: 'Competency 職能（素養）= f(K 知識, S 技能, A 態度)，看的是三者組合出來的結果。' },
    { q: '三者之中，哪一項最模糊、最容易被寫成空話？', opts: ['知識，因為範圍太廣', '技能，因為難以量化', '態度，因為最難驗證', '三者的明確度相同'], ans: _A2, exp: 'K 與 S 通常寫得明確也查得到；A 最模糊、最不容易觀察，第八週會專門處理。' },
    { q: '這一節與期末專案的關係是什麼？', opts: ['只是背景知識，不會用到', '它就是期末專案的骨架', '期末專案不談產業結構', '要等到第十五週才會用'], ans: _A1, exp: '晨報 Agent 做的就是：抓取某產業的 JD，用 K/S/A 拆解，回答這一行在找什麼樣的人。' }
  ],

  /* ---------- M3 Shape Yourself ---------- */
  m3_nav: '3. Shape Yourself',
  m3_title: 'Shape Yourself：把大學四年變成地基',
  m3_overview: '看完世界與產業，最後把鏡頭對準你自己。大學的必修、選修、課程地圖與各種活動，都可以變成職涯的地基——但它們不會自動變成，要你主動去接。',
  m3_highlights: ['課程地圖', '專題', '競賽', '實習', 'PBL', 'SDL'],
  m3_p1: '第一組材料是**課程**：必修、選修、以及系上的課程地圖。課程地圖常常被當成畢業檢核表，但它其實是一張路線圖——它說明系上認為一個畢業生應該長成什麼樣子。你可以不同意它，但你要先看懂它，才知道自己是在照著走還是在繞路。',
  m3_p2: '第二組材料是**課堂之外**：專題、競賽、實習、社團、志工。這些東西的價值不在於履歷上多一行，而在於它們是少數會逼你面對「沒有標準答案」的場合。企業要看的往往不是你參加過什麼，而是你在那裡遇到什麼問題、怎麼處理。',
  m3_p3: '第三個東西是**人**：指導教授、學長姐、業界的人。前兩組材料你自己就能拿到，但要把它們接到職涯上，多半需要有人告訴你「你現在缺的是這個」。這件事不會自己發生，要你主動開口。',
  m3_p4: '這一層背後有兩個學習方法。**PBL（問題導向學習）**：從一個真實的問題出發，而不是從一個章節出發。**SDL（自主學習）**：由你自己決定要學什麼、學到什麼程度、怎麼驗收。這門課整個是照這兩個原則設計的——課堂只有 50 分鐘，其餘的都在課外，而課外那段時間怎麼用，是你的決定。',
  m3_svg_cap: '個人層：三組材料匯進職涯地基，PBL 與 SDL 是驅動它的兩個引擎',
  m3_terms: [
    { front: '課程地圖', back: '常被當成畢業檢核表，其實是系上對「一個畢業生該長成什麼樣」的路線圖。你可以不同意，但要先看懂才知道自己在走還是在繞。' },
    { front: 'PBL · 問題導向學習', back: '從一個真實的問題出發，而不是從一個章節出發。這門課每一週的學習單都是這樣設計的。' },
    { front: 'SDL · 自主學習', back: '由你自己決定學什麼、學到什麼程度、怎麼驗收。課堂只有 50 分鐘，真正的份量都在課外。' },
    { front: '課堂之外的價值', back: '不在於履歷多一行，而在於那是少數會逼你面對「沒有標準答案」的場合。企業想聽的是你遇到什麼問題、怎麼處理。' },
    { front: '主動開口', back: '課程與活動你自己拿得到，但把它們接到職涯上通常需要有人指出你缺什麼。這件事不會自己發生。' }
  ],
  m3_wrapup: '這一層最容易被講成勵志話，所以請把它換成一個很具體的問題：你手上已經有的東西——修過的課、做過的專題、打過的工——哪一樣能接到你想去的那個產業？接不上的那些，是真的沒用，還是你還沒找到接法？',
  m3_q: [
    { q: '這一節認為課程地圖真正的用途是什麼？', opts: ['確認畢業學分是否修足', '看懂系上對畢業生的期待', '比較各系之間的難易度', '決定要不要轉系或雙主修'], ans: _A1, exp: '它是一張路線圖，不是檢核表。看懂了才知道自己在照著走還是在繞路。' },
    { q: '課堂之外的活動，價值主要在哪裡？', opts: ['讓履歷看起來比較豐富', '累積可以量化的時數', '逼你面對沒有標準答案', '認識更多同年級的人'], ans: _A2, exp: '企業想聽的往往不是你參加過什麼，而是你在那裡遇到什麼問題、怎麼處理。' },
    { q: 'PBL（問題導向學習）的起點是什麼？', opts: ['教科書的某一個章節', '一個真實存在的問題', '教師指定的參考書目', '一份標準化的測驗卷'], ans: _A1, exp: '從真實問題出發，而不是從章節出發。這門課每一週的學習單都照這個設計。' },
    { q: 'SDL（自主學習）強調的是什麼？', opts: ['由你決定學什麼與如何驗收', '完全不需要教師介入或引導', '學習速度必須要比別人更快', '所有內容都得自己上網找資料'], ans: _A0, exp: '自己決定學什麼、學到什麼程度、怎麼驗收。這門課的份量絕大多數在課外。' },
    { q: '這一節說「這件事不會自己發生」，指的是什麼？', opts: ['主動去找人指出你缺什麼', '按時完成每一門課作業', '參加愈多活動愈有幫助', '畢業前一定要出國交換'], ans: _A0, exp: '課程與活動你自己拿得到，但接到職涯上通常需要有人告訴你現在缺的是什麼。' }
  ],

  /* ---------- M4 成為產品經理 ---------- */
  m4_nav: '4. 成為產品經理',
  m4_title: '成為產品經理：三層的交會點',
  m4_overview: '看世界、看產業、看自己——這三層看完之後，會發現有一個角色剛好站在它們的交會點上：產品經理。國企系的課程乍看零散，但在這個角色裡，它們會整合成一個清晰的整體。',
  m4_highlights: ['策略思維', '行銷敏銳度', '數據決策', '跨部門協調', '跨文化溝通'],
  m4_p1: '產品經理要做的事，可以拆成五塊。**策略思維**：洞察市場趨勢、分析競爭對手，判斷這個東西該不該做。**行銷敏銳度**：辨識顧客需求，提出說得動人的價值主張。**數據決策**：用資料而不是直覺來下判斷。**跨部門協調**：把研發、設計、行銷、營運兜在一起，確保產品從概念走到上市。**跨文化與國際溝通**：在全球市場裡，這件事的難度常常被低估。',
  m4_p2: '把這五塊擺回國企系的課表，對應關係其實很直接：策略管理對到策略思維，國際行銷對到行銷敏銳度，財務分析對到數據決策，跨文化溝通對到最後一項。而跨部門協調——那是專案管理，也就是這門課後半段要教的東西。',
  m4_p3: '所以對國企系學生而言，PM 不只是一份工作，而是一個**舞台**：它讓你把課堂上學的商業知識與分析架構，直接落實到產業實務裡。這也是為什麼這門課叫「產品經理職涯策略與專案管理導論」——前半談角色與職涯，後半談怎麼真的把一件事做出來。',
  m4_p4: '但這裡要誠實講一件事：PM 這個職位本身，正在被改變。過去的 PM 寫規格、排優先順序、交給工程團隊。現在的邊界正在移動——這正是下一節三個轉變裡的第三個。所以你在這一節看到的職能清單，不是終點，是一個正在變形中的起點。',
  m4_svg_cap: '三層的交會點：PM 的五項職能，以及它們與國企系課程的對應',
  m4_terms: [
    { front: '產品經理 · PM', back: '站在總體、產業、個人三層交會點上的角色。要同時具備策略思維、行銷敏銳度、數據決策、跨部門協調與跨文化溝通。' },
    { front: '價值主張', back: '你要說清楚：這個產品為誰解決什麼問題，為什麼是你來解決比較好。辨識顧客需求之後的下一步。' },
    { front: '跨部門協調', back: '把研發、設計、行銷、營運兜在一起，讓產品從概念走到上市。這其實就是專案管理，也是這門課後半段的內容。' },
    { front: '為什麼是舞台', back: '因為它讓課堂上的商業知識與分析架構直接落實到產業實務，而不是停在期末報告裡。' },
    { front: 'Stage-Gate', back: '新產品開發的階段關卡模型：每一階段結束前設一道關卡，決定繼續、修正還是停掉。PM 的日常決策場景之一。' }
  ],
  m4_wrapup: '這一節給你的不是一個志願，是一組座標。就算你最後不做 PM，這五項職能與它們對應的課，仍然是你判斷「我現在缺什麼」的一把尺。',
  m4_q: [
    { q: '產品經理站在哪三個層級的交會點上？', opts: ['總體、產業、個人', '研發、行銷、營運', '學校、企業、政府', '策略、戰術、執行'], ans: _A0, exp: '看世界（總體）、看產業、看自己（個人）——PM 剛好落在三者交會處。' },
    { q: '「提出具說服力的價值主張」屬於哪一項職能？', opts: ['策略思維與趨勢判斷', '行銷敏銳度與需求辨識', '數據分析與決策依據', '跨文化與國際化溝通'], ans: _A1, exp: '先辨識顧客需求，再提出說得動人的價值主張，這是行銷敏銳度那一塊。' },
    { q: '國企系的「財務分析」主要對應到 PM 的哪一項？', opts: ['以資料為依據做決策', '洞察市場趨勢與對手', '協調研發設計與營運', '處理跨文化溝通問題'], ans: _A0, exp: '用資料而不是直覺下判斷，就是數據決策那一塊。' },
    { q: '「跨部門協調」在這門課裡對應到什麼？', opts: ['國際行銷的通路管理', '策略管理的競爭分析', '課程後半的專案管理', '財務分析的成本控制'], ans: _A2, exp: '把研發、設計、行銷、營運兜在一起，本質上就是專案管理。' },
    { q: '這一節最後提醒了什麼？', opts: ['PM 的薪資水準高於平均', 'PM 這個職位正在被改變', 'PM 只適合國企系的學生', 'PM 需要先累積十年年資'], ans: _A1, exp: '職能清單不是終點，而是一個正在變形中的起點——下一節的第三個轉變就在談這件事。' }
  ],

  /* ---------- M5 三個轉變 ---------- */
  m5_nav: '5. 三個轉變',
  m5_title: '三個轉變：這三層正在被改寫',
  m5_overview: '前面四節是這門課的骨架，而且骨架本身沒有過期。但把時間拉到 2026 年，這三個層級都正在被同一股力量改寫。談 AI 對工作的影響，最常見的講法是「又出現了一個新產業」——這個講法會害你做錯決定。',
  m5_highlights: ['AI 代理人', '實體 AI', '職務變形', 'smart everything'],
  m5_p1: '先把傘狀命題講清楚：**不是多了一個新產業，是每一個既有產業都要重做一次**。製造、零售、醫療、物流、金融、農業，每一個都在把自己的流程換成由 AI 參與決策的版本。所以問題不是「我要不要轉行去做 AI」，而是「我想去的那一行，重做的部分在哪裡」。用第二節那條鏈來說：被改寫的是**部門與職位**那兩層，產業與企業還在。',
  m5_p2: '**張力一，打在 See the World 那一層：誰在買東西？** 過去一百年，商業模式的底層假設是「人會來」——來逛店、來看廣告、來比價。行銷、品牌、通路的價值全部建立在這個假設上。當比價、下單、續約都由 AI 代理人代勞，人不再親自逛，品牌溢價還在嗎？通路還能收上架費嗎？廣告要投放給誰看？你自己就是消費者，先想想你已經有多少決定其實不是你自己做的。',
  m5_p3: '**張力二，打在 Understand Industry 那一層：哪一種工作先被改？** 前幾年流行的說法是「AI 先取代坐辦公室的，動手的工作還安全」。無人載具與人形機器人讓這個安慰失效了——AI 走出螢幕、有了身體之後，倉儲、配送、巡檢、清潔都進入可自動化的範圍。但這不等於「什麼都會被取代」。真正的問題是：在一個機器能動也能想的環境裡，什麼樣的能力反而變得更貴？',
  m5_p4: '**張力三，打在 Shape Yourself 與 PM 那一層：我想做的那個職位，還會長成那樣嗎？** 上一節列的五項職能，是以「PM 寫規格、交給工程團隊」為前提的。現在有一種角色叫 **FDE（Forward Deployed Engineer，前進部署工程師）**：帶著產品直接進客戶現場，當場理解問題、當場改、當場交付，不等下一個開發週期。這個角色正在往 PM 與 PjM 的地盤擴張。你要想的是——你準備的是舊版本的那個職位，還是新版本的？',
  m5_p5: '這三個張力放在第一週，不是要你變成專家。是因為第一份作業要你**表態**，不是要你複述。你可以完全答錯，但你必須有立場——因為到了第十六週，你會把今天寫的東西拿出來重看一次，那時候有沒有進步，取決於今天有沒有留下一個夠具體、夠可以被推翻的說法。',
  m5_svg_cap: '一個共同前提，三個張力，各自打在前面三個層級上',
  m5_terms: [
    { front: 'AI 代理人 · AI Agent', back: '不只回答問題，還能代替你執行多步驟任務：查資料、比價、下單、追蹤、回報。它把「人親自操作」這個假設從商業模式裡拿掉。' },
    { front: '實體 AI · Physical AI', back: '有身體的 AI——人形機器人、無人載具、自動化倉儲。差別在於它能改變實體世界的狀態，不只是產出文字或影像。' },
    { front: 'FDE · 前進部署工程師', back: '帶著產品直接進客戶現場，當場理解、當場修改、當場交付，不等下一個開發週期。正在往 PM 與 PjM 的職務範圍擴張。' },
    { front: '典範轉移', back: '不是原本的做法變快變好，而是「大家對於什麼叫做正常」的那個共識整個換掉。檢核的方式是：舊方法效率再高也追不上。' },
    { front: 'smart everything', back: '智慧製造、智慧零售、智慧醫療、智慧城市。共同點不是加了新東西，而是既有流程換成由 AI 參與決策的版本。' },
    { front: '被改寫的是哪兩層', back: '用第二節那條鏈看：產業與企業大致還在，真正在重組的是部門與職位，連帶改寫 JD 上的每一條要求。' }
  ],
  m5_wrapup: '這一節不要求你答對。它要求你在三個張力裡至少挑兩個，寫出一個「有可能被推翻」的說法——不是「AI 會改變很多事」這種沒有人會反對的話，而是具體到你自己願意為它辯護的程度。',
  m5_q: [
    { q: '「不是多了一個新產業」這句話在提醒什麼？', opts: ['應該盡快轉行去做 AI', '傳統產業即將全部消失', '既有產業要在內部重做', 'AI 產業的待遇比較好'], ans: _A2, exp: '既有產業被從內部重做，所以問題是「我那一行重做的部分在哪裡」。' },
    { q: '用第二節那條鏈來看，真正被重組的是哪兩層？', opts: ['產業與企業這兩層', '部門與職位這兩層', '企業與部門這兩層', '職位與 JD 這兩層'], ans: _A1, exp: '產業與企業大致還在，重組的是部門與職位，連帶改寫 JD 上的每一條要求。' },
    { q: '張力一動搖的是哪一個長久以來的假設？', opts: ['消費者總是追求最低價', '人會親自來逛來看來比', '品牌一定需要投放廣告', '通路必須有實體的店面'], ans: _A1, exp: '行銷、品牌、通路的價值都建立在「人會來」上；代理人代勞後這個前提鬆動。' },
    { q: '關於實體 AI，這一節的說法是什麼？', opts: ['所有動手的工作都會消失', '短期之內不會產生影響', '只有製造業會受到衝擊', '要問什麼能力反而變貴'], ans: _A3, exp: '課文明確反對「什麼都會被取代」，要問的是哪些能力反而更值錢。' },
    { q: 'FDE 與傳統 PM 最大的差別在哪裡？', opts: ['現場理解、現場改、現場交', '不需要理解產品的內容', '薪資結構與獎金制度不同', '只存在於新創規模的公司'], ans: _A0, exp: '差別在交付的方式與節奏，不等下一個開發週期。' },
    { q: '為什麼第一份作業要你「表態」而不是複述？', opts: ['表態的作業比較好評分', '第十六週要拿來對照用', '教師想知道你的價值觀', '複述容易被判定為抄襲'], ans: _A1, exp: '沒有立場，期末就沒有東西可以對照，也看不出進步。' }
  ],

  /* ---------- M6 第一天要交的兩份 ---------- */
  m6_nav: '6. 第一天要交的兩份',
  m6_title: '第一天要交的兩份東西',
  m6_overview: 'W1 當天你要交兩樣東西，而它們屬於**兩份不同的作業**：一是**學習單 W1 的 Part A**（手寫三題），二是**一分鐘英文自我介紹的真實版**（影片）。兩份都在**當天 23:59** 截止，上傳指定的 Moodle 作業區。共同點是：都不准用 AI，因為它們是「之前」的快照。',
  m6_highlights: ['手寫三題', '一分鐘自介', '不用 AI', '當天 23:59'],
  m6_partA: '學習單 W1 · Part A（手寫三題）',
  m6_a1: '**第一題 · See the World**：從三個張力裡挑兩個，寫出你的立場。不是摘要那三段在講什麼，是寫「你認為會怎樣」。可以很短，但要具體到別人有辦法反對你。',
  m6_a2: '**第二題 · Understand Industry**：挑一個你想去的產業，用第二節那條鏈說明——你挑的那兩個張力，會改掉這個產業的哪一個部門或哪一種職位。想不出來也是一個發現，誠實寫下來。',
  m6_a3: '**第三題 · Shape Yourself**：根據你上面寫的，從這學期開始，你要做的「一件」具體的事是什麼。只准寫一件。「多讀書」「多學技能」不算，那是還沒想清楚的說法。要具體到你下週就能開始做。',
  m6_wsnote: '學習單 W1 還有一個 **Part B**，那是 **W2 課堂上小組一起做**的 AI 協作練習——跟自我介紹影片是兩回事，別搞混了。Part A 是你一個人、不用 AI、W1 當天要交；Part B 要等到 W2 進教室才做。',
  m6_partB: '自我介紹影片 · 真實版',
  m6_promise: '這一份不計分、不對全班公開，只有教師看得到。',
  m6_promise_d: '你不必講得流利，不必背稿，不必重錄十次。講得結巴、停頓、想不到字都沒關係——那正是「之前」該有的樣子。W2 課後你會與 SDL 學習夥伴協作一份講稿再錄一次，那一份**在班內公開**、一樣不計分，截止在 **W3 上課前一天（9/22 週二）23:59**。兩份放在一起，差距就是這門課給你的第一個具體證據。所以第一份愈真實，這個證據愈有價值。',
  m6_b1: '用 4Q 這四個問題來想，一分鐘講得完的份量就好：① 個人特質、興趣、家庭與成長背景；② 課外經歷——打工、實習、競賽、社團、志工；③ 為什麼選這門課、你的目標是什麼；④ 你現在最需要什麼樣的協助。第③與第④題對教師最有用，請認真講。',
  m6_b2: '手機直接錄影就可以，不需要設備或剪輯。光線看得清楚、聲音收得到就夠了。課程的自我介紹練習頁有內建的錄影錄音工具、4Q 提詞與 CEFR 對照，可以先去那裡練一次。連結在資源那一頁。',
  m6_p1: '為什麼兩份都不准用 AI？因為這門課後面十七週幾乎每一份作業都會用 AI，而且會用得很深。正因為如此，第一天這兩份必須先讓你看清楚：在完全沒有外援的時候，你腦子裡有什麼、你的英文口說是什麼樣子。這是基準線，不是懲罰。手寫還有一個很實際的作用——它讓你慢下來。用鍵盤打字容易寫出通順但空洞的句子；用筆寫，你會因為懶得寫廢話而自動變得具體。',
  m6_p2: '沒有在 23:59 前交會怎樣？我會建議你盡速退選，TA 也會通知你的系辦。理由不是懲罰——通識課是排志願抽籤的，這門課限 36 人，你的名額後面有人在排隊等遞補。第一份最基本的作業就沒有交，那個位子留給真的想上的人比較好，而且愈早釋出，遞補的人愈來得及跟上。',
  m6_p3: '如果你是選課系統遞補進來、W1 那天不在教室，一樣要交這兩份，時間是 W2 上課之前。如果你想找教師現場加簽，這兩份也請先準備好——加簽與否由教師綜合判斷。',
  m6_terms: [
    { front: '為什麼手寫', back: '慢下來，避免寫出通順但空洞的句子；同時產生一張無法被 AI 代筆的「之前」快照。' },
    { front: '為什麼不用 AI', back: '第十六週要拿今天的東西回頭對照。如果今天是 AI 寫的，你對照到的是 AI 的進步，不是你的。' },
    { front: '4Q', back: '個人特質與背景／課外經歷／選課動機與目標／最需要的協助。第三與第四題對教師最有用。' },
    { front: '不計分、不公開', back: '真實版影片只有教師看得到，不對全班公開，也不計分。講得結巴完全沒關係。' },
    { front: '「一件」具體的事', back: '第三題只准寫一件，且要具體到下週就能開始做。「多讀書」是還沒想清楚的說法。' },
    { front: '可以被反對', back: '好的立場要能被別人不同意。無人會反對的說法（例如「AI 會改變很多事」）等於沒有說。' },
    { front: 'Part A 不等於自介影片', back: 'Part A 是學習單 W1 的第一部分；學習單的 Part B 是 W2 課堂的小組 AI 練習。自我介紹影片是另一份獨立作業，跟 Part A／B 無關。' }
  ],
  m6_wrapup: '這兩份的重點都是「有交」，不是「做得好」。它們是基準線，不是考試。真正被評的那一次在第十六週，那時候你會慶幸自己今天留下了誠實的版本。',
  m6_q: [
    { q: '第一天要交的兩份東西，截止時間是？', opts: ['W1 當天晚上 23:59', 'W2 第二堂上課之前', '本學期加退選截止日', '第一次上課後的一週內'], ans: _A0, exp: '兩份都在 W1 上課當天 23:59 前上傳指定的 Moodle 作業區。' },
    { q: 'Part A 三題的繳交方式是什麼？', opts: ['線上表單直接填寫送出', '打字成文件檔上傳系統', '手寫拍照上傳 Moodle', '課堂上輪流口頭回答'], ans: _A2, exp: '用 iPad 或紙筆手寫，拍一張清楚的照片上傳。' },
    { q: '第三題「Shape Yourself」要求寫幾件事？', opts: ['一件，下週就能開始', '三件，依重要性排序', '五件，涵蓋四年規劃', '不限件數，愈多愈好'], ans: _A0, exp: '只准寫一件，而且要具體到下週就能開始做。' },
    { q: '關於真實版自我介紹影片，下列何者正確？', opts: ['會在課堂上播放給全班', '只有教師看、不計分', '佔學期成績的百分之十', '需要先用 AI 寫好講稿'], ans: _A1, exp: '不計分、不對全班公開、只有教師看得到——所以講得結巴沒關係。' },
    { q: '沒有在期限前繳交，這一頁說會怎樣？', opts: ['扣除平時成績的分數', '改為口頭補做即可', '建議退選並通知系辦', '對修課完全沒有影響'], ans: _A2, exp: '理由是維護排隊遞補者的權益，愈早釋出名額，遞補的人愈來得及跟上。' },
    { q: '遞補進來、W1 沒到教室的學生該怎麼辦？', opts: ['兩份都不需要補交了', '學期末一次補齊即可', 'W2 上課前補交兩份', '只補交影片就可以了'], ans: _A2, exp: '手寫三題與真實版影片都要補，時間是 W2 上課之前。' },
    { q: '學習單 W1 的 Part B 指的是什麼？', opts: ['W2 課堂的小組 AI 協作練習', 'W1 當天要交的一分鐘英文自介影片', 'W1 課前要填的個人資料與背景表', '學期末要繳的個人學習反思報告'], ans: _A0, exp: 'Part B 在 W2 課堂上由小組一起做，跟自我介紹影片沒有關係。' }

  /* ---------- M7 三條查證原則 ---------- */
  m7_nav: '7. 三條查證原則',
  m7_title: '這一頁不告訴你現在怎麼樣',
  m7_overview: '你可能已經注意到：談三個轉變的時候，我沒有給你任何一家公司的名字、任何一款機器人、任何一個製程數字。這是刻意的。這一頁不告訴你現在怎麼樣，它告訴你怎麼查——因為到你畢業那年，我現在寫下的任何具體數字都已經過期了。',
  m7_highlights: ['看日期', '找一手來源', '找反對意見'],
  m7_p1: '**第一條 · 看日期。** 任何一則關於 AI 的說法，先找它是什麼時候寫的。這個領域六個月就換一輪，一篇兩年前的分析可能整段前提都不成立了。沒有標日期的內容，預設當作不可信。這一條看起來太簡單，但它能濾掉你會遇到的大半垃圾。順帶一提，AI 本身也有這個問題——它的訓練資料有截止日，它不會主動告訴你它的認知停在哪一天。',
  m7_p2: '**第二條 · 找一手來源。** 你看到的多數說法是二手、三手甚至五手的轉述。每轉一手就掉一點限制條件，掉到最後就變成「研究顯示 AI 將取代 40% 工作」這種你完全不知道怎麼來的句子。往回找：誰做的、樣本是什麼、定義怎麼下的。找不到一手來源，就當作那個說法還沒成立。',
  m7_p3: '**第三條 · 找反對意見。** 如果你查完一個題目，看到的全部是同一個方向的說法，那不是因為這件事沒有爭議，是因為你的搜尋方式只找得到同一種答案。主動去找「不同意的人怎麼說」——不是為了公平，是因為反對意見通常會直接告訴你這個論點最脆弱的地方在哪裡。你要判斷的是強度，不是聲量。',
  m7_p4: '為什麼第一週就講這個？因為這門課後面會大量使用 AI，而 AI 最擅長的就是產出「看起來很有道理、日期不明、來源模糊、沒有反方」的內容。這三條原則是你之後每一週都會用到的過濾器。到了第十週我們談 Context Engineering 的時候，你會發現這三條就是它的雛形。',
  m7_terms: [
    { front: '看日期', back: 'AI 領域六個月換一輪。沒有標日期的內容預設不可信。AI 本身也有訓練資料截止日，它不會主動告訴你。' },
    { front: '找一手來源', back: '每轉述一手就掉一些限制條件。往回找：誰做的、樣本多大、定義怎麼下。找不到就當作還沒成立。' },
    { front: '找反對意見', back: '全部同一個方向，通常代表你的搜尋方式有偏。反對意見會直接指出論點最脆弱的地方。' },
    { front: '強度不是聲量', back: '一個說法被講很多次，跟它站得住腳，是兩件不同的事。' }
  ],
  m7_wrapup: '這三條不是學術規範，是自保工具。你在這門課裡查到的每一個說法、AI 給你的每一段回答，都可以用這三條先過一遍。過不了的，先別拿去寫作業。',
  m7_q: [
    { q: '為什麼這一頁刻意不給公司名稱與數字？', opts: ['擔心引用會有版權問題', '具體資訊很快就會過期', '大一學生看不懂這些', '教師手上沒有這些資料'], ans: _A1, exp: '到你畢業那年，現在寫下的具體數字都已經過期了。方法比答案耐久。' },
    { q: '「看日期」為什麼對 AI 主題特別重要？', opts: ['方便依時間先後排序', '新聞稿一定會標日期', '這個領域半年換一輪', '教師會檢查引用格式'], ans: _A2, exp: '兩年前的分析可能整段前提都不成立；AI 本身也有訓練資料截止日。' },
    { q: '「找一手來源」要對抗什麼問題？', opts: ['轉述會掉掉限制條件', '一手資料取得成本低', '二手資料一定是假的', '資料太多讀不完'], ans: _A0, exp: '每轉一手就掉一些條件，最後變成無法追溯的句子。要往回找誰做的、樣本多大。' },
    { q: '查完發現全是同一個方向的說法，該怎麼辦？', opts: ['直接採用，代表有共識', '主動去找反對的意見', '換一個題目重新查起', '相信最多人講的版本'], ans: _A1, exp: '可能是搜尋方式造成的偏差；反對意見會直接指出論點最脆弱的地方。' },
    { q: '這三條原則到第十週會變成什麼？', opts: ['Prompt Engineering', 'Project Management', 'Context Engineering', 'Design Thinking 設計思考'], ans: _A2, exp: '第十週談 Context Engineering 時，你會發現這三條就是它的雛形。' }
  ],

  m8_rhythm: '每週的節奏',

  m8_after_d: '第二週上課時會發給你課程總入口的通行碼。那裡有十八週完整的教材導航、十二份互動學習單、期末專案規格、評量與繳交規則、AI 使用與資料倫理聲明，以及「SDL 學習夥伴」的安裝說明——那是一份課程專用的指示檔，會把你的 AI 變成會反問你的學習夥伴。這一頁看到的只是入口，不是全部。',
  m8_p1: '關於成績：這門課的評分重心不在期末考，而在每週的學習單、小組簡報、以及期末專案的驗收。細節在通行碼後面的入口頁，但精神可以先講——這門課評的是「你做出了什麼、能不能重跑」，不是「你背了什麼」。',
  m8_p2: '關於分組：第二週分組，會刻意混合科系與年級。這門課是通識，教室裡會同時有資工系大四和中文系大一，而期末專案剛好需要不同背景的人湊在一起——需要有人問對問題，也需要有人把東西做出來。每一組會確保至少有一位對工具操作有興趣或經驗的同學。如果你不會寫程式，你不是來墊底的；如果你會，你不是來當工具人的。',

  m0_nav: '0. What this course does',
  m0_title: 'What this course does, and what you have to decide today',
  m0_intro: 'This is a one-credit general-education elective, fifty minutes on Wednesday afternoons, capped at thirty-six students, taught entirely in English. The whole course rests on three levels — see the world, understand industry, shape yourself — and where the three meet stands one role: the product manager. By the end of eighteen weeks your team will own a URL: a morning brief that updates itself every day and that anyone can open, analysing what the industry you want to enter is actually hiring for. It is not a report; it is something that genuinely runs. But before you decide to stay, one thing has to be said plainly: this course costs more than the fifty minutes in the room. It costs at least two hours a week outside it, and it expects you to have a paid AI plan. This page lays out every condition, everything due on the first day, and what happens if you do not hand it in. Read it, then decide. That is better for both of us.',
  m0_why: 'Why lead with the conditions?',
  m0_why_desc: 'Because the course is capped at thirty-six, and general-education places are allocated by preference and ballot. If you discover in week five that you cannot keep up, the place you drop can no longer be filled — and it could have gone to someone who really wanted it. So the bar goes at the front, not buried on the last page.',

  m0_start: 'Start reading →',
  m0_endpoint: 'Look at the endpoint first',
  m0_endpoint_desc: 'This is the instructor’s own morning-brief agent, refreshed automatically every morning. By the end of term every team will have one of these, pointed at an industry you choose. Open it now.',

  /* ---------- M1 See the World ---------- */
  m1_nav: '1. See the World',
  m1_title: 'See the World: you are not choosing courses alone',
  m1_overview: 'No university student is only an individual. You are shaped at the same time by family, university, society, industry and even the global environment. This is the macro level, and it says one thing: your studies and your career were never a purely personal choice.',
  m1_highlights: ['Student', 'University', 'Society & industry', 'Government policy', 'Global PESTEL'],
  m1_p1: 'This level has three building blocks. **Family** is where you start — your background, your resources, what is expected of you; most people receive their first set of defaults here. **University** is where you are now — courses, faculty, classmates, and the classes you did or did not get into, which together decide what you will bump into over the next four years. **Society and industry** is where you are going — future ways of living and career opportunities are defined there, and it moves considerably faster than a course catalogue.',
  m1_p2: 'Two rings sit outside the three. The inner ring is **government policy**: tuition, student loans, industry–academia programmes, subsidies, labour law. None of it asks your opinion, and all of it changes your options. The outer ring is **global PESTEL** — political, economic, social, technological, environmental and legal, the six macro dimensions. Geopolitics, falling birth rates, climate regulation and AI all operate in that ring.',
  m1_p3: 'Why start here? Because when people make career decisions they usually see only the "me" in the middle. "What do I like" and "what suits me" are not wrong questions, but they cannot be answered on their own. The same interest, placed in a different industry structure, a different policy environment or a different decade, leads somewhere completely different.',
  m1_p4: 'What this course does next is zoom inward from here: first the world (macro), then industry (structure and roles), then you (four years and a career). Once all three are on the table, the product manager appears exactly where they intersect. That is not a coincidence; it is where the whole design of this course lands.',
  m1_svg_cap: 'The macro level: three building blocks, ringed by government policy and global PESTEL',
  m1_terms: [
    { front: 'Macro level', back: 'The layer that connects students, universities, industry, society and the global stage. It insists that personal growth is not isolated but embedded in social change and global competition.' },
    { front: 'PESTEL', back: 'Political, economic, social, technological, environmental and legal — six macro dimensions. Use it to check what you cannot control that nonetheless changes your options.' },
    { front: 'Three building blocks', back: 'Family (your background and starting point), university (courses and faculty), society and industry (future life and careers). Together they decide which paths you can even see.' },
    { front: 'Why start with the world', back: 'Because "what do I like" cannot answer a career question alone. The same interest in a different industry structure, or a different decade, ends somewhere else entirely.' }
  ],
  m1_wrapup: 'This section does not ask you to memorise six letters. It asks you to change the question: instead of only "what do I want to do", ask "what forces are pushing the thing I want to do". That phrasing gets used every week until week eighteen.',
  m1_q: [
    { q: 'What does the macro level mainly insist on?', opts: ['Interests should drive course choice', 'Studies and career are not only yours', 'Studying abroad builds competitiveness', 'University ranking sets your ceiling'], ans: _A1, exp: 'Personal growth is not isolated; it is embedded in social change and global competition.' },
    { q: 'What are the three building blocks at this level?', opts: ['Family, university, society and industry', 'Interest, ability, personality and traits', 'Tuition, student loans, and scholarships', 'Politics, economy, society and culture'], ans: _A0, exp: 'Family is the start, university is where you are now, society and industry is where you are going.' },
    { q: 'Which six dimensions does PESTEL name?', opts: ['Product, place, price, promotion, people', 'Political, economic, social, tech, environmental, legal', 'Knowledge, skills, attitude, experience, network', 'Strategy, structure, process, system, culture'], ans: _A1, exp: 'Six macro dimensions, used to check the forces you cannot control that change your options.' },
    { q: 'Where does government policy sit in this diagram?', opts: ['At the innermost point of the three', 'Entirely outside of this diagram', 'Between the three blocks and PESTEL', 'Alongside family as a fourth block'], ans: _A2, exp: 'Policy rings the three blocks and sits inside global PESTEL: it never asks you, but it changes your options.' },
    { q: 'What change of question does this section ask for?', opts: ['Which job pays the most money', 'Which university has a better name', 'What forces push what I want to do', 'Which career suits my personality'], ans: _A2, exp: 'From "what do I want to do" to "what forces are pushing the thing I want to do".' }
  ],

  /* ---------- M2 Understand Industry ---------- */
  m2_nav: '2. Understand Industry',
  m2_title: 'Understand Industry: from a sector down to one JD',
  m2_overview: 'With the world in view, bring the lens closer. Two things matter at this level: what an industry looks like (how it divides), and how a single job gets defined out of it. The second matters far more than the first.',
  m2_highlights: ['Primary', 'Secondary', 'Tertiary', 'New economy', 'JD', 'Competency = f(K, S, A)'],
  m2_p1: 'Industry divides into four categories. **Primary** handles raw materials: agriculture, forestry, fishing, livestock and mining. **Secondary** manufactures: it turns materials into products. **Tertiary** is retail and services: it puts products and services into people’s hands. The fourth is the **new economy** — digital industries and entrepreneurship — which fits the first three poorly, because what it produces is often not an object but a mechanism.',
  m2_p2: 'More important than the categories is this chain: **industry → company → department → position → job description (JD)**. Most people job-hunt from the right-hand end — they see a posting, think it looks acceptable, and apply. But that posting looks the way it does because of the four layers to its left. Walk the chain backwards once and you learn what the job actually is, why it exists, and whether it will still exist in five years.',
  m2_p3: 'What you accumulate at university has to map onto the JD in the end, and the language of that mapping is one formula: **Competency = f(K knowledge, S skills, A attitude)**. Whether someone can hold a position is not decided by any single item but by what the three combine into — which is what week seven, the competency map, spends the whole week on. Almost every line in a JD belongs to one of the three. Knowledge and skills are usually stated clearly and can be checked; attitude is the vaguest and hardest to verify, which is exactly why it is the easiest to fill with empty words. Week eight takes that on as its own topic.',
  m2_p4: 'This chain is the skeleton of the term project. What your morning-brief agent does is, in essence: collect a large number of JDs from one industry, take them apart into K, S and A, and answer what that industry is actually hiring for. So this section is not background — it is a specification.',
  m2_svg_cap: 'Four categories of industry, and the five-layer chain from sector to job description',
  m2_terms: [
    { front: 'Four categories', back: 'Primary (raw materials), secondary (manufacturing), tertiary (retail and services), new economy (digital industries and entrepreneurship). The fourth often produces a mechanism rather than an object.' },
    { front: 'Industry→company→department→position→JD', back: 'A posting looks the way it does because of the four layers to its left. Walk it backwards to learn why the job exists and whether it survives five years.' },
    { front: 'JD · Job description', back: 'The right-hand end of the chain, and the document your university learning has to map onto. It is also what the term project analyses at volume.' },
    { front: 'Competency', back: 'Competency = f(K knowledge, S skills, A attitude). Whether someone can hold a position comes from what the three combine into, not from any single item. Week seven — the competency map — spends the whole week on it.' },
    { front: 'K / S / A', back: 'Knowledge, skills, attitude. Almost every JD line belongs to one; K and S are stated clearly and can be checked, while A is vaguest and easiest to fill with empty words.' },
    { front: 'New economy', back: 'Digital industries and entrepreneurship. It fits the primary–secondary–tertiary logic poorly because its output is often a mechanism or platform, not something you can put on a shelf.' }
  ],
  m2_wrapup: 'Take away one chain and one formula: industry → company → department → position → JD, and Competency = f(K knowledge, S skills, A attitude). They are not vocabulary; by week ten they are the data structure you will be writing code against.',
  m2_q: [
    { q: 'What does the "new economy" category refer to?', opts: ['Extraction of raw materials and farming', 'Turning raw materials into finished goods', 'Digital industries and entrepreneurship', 'Retail channels and consumer services'], ans: _A2, exp: 'Its output is often a mechanism or platform rather than an object, so the first three categories fit it poorly.' },
    { q: 'Which is the correct order of the chain?', opts: ['Position → department → company → industry → JD', 'Industry → company → department → position → JD', 'JD → position → industry → company → department', 'Company → industry → position → department → JD'], ans: _A1, exp: 'It narrows left to right; the posting you actually see is the far right-hand end.' },
    { q: 'Why walk the chain backwards from industry?', opts: ['Because you should research a firm first', 'Because the posting is set by the layers left', 'Because large firms offer more job security', 'Because industry reports are easy to obtain'], ans: _A1, exp: 'Working backwards tells you what the job is, why it exists, and whether it lasts five years.' },
    { q: 'How does this course define competency?', opts: ['Competency = f(knowledge, skills, attitude)', 'Competency = f(degree, tenure, certificates)', 'Competency = f(interest, aptitude, character)', 'Competency = f(salary, grade, age)'], ans: _A0, exp: 'Competency = f(K knowledge, S skills, A attitude) — what the three combine into, not any single item.' },
    { q: 'Which of the three is vaguest and easiest to fake?', opts: ['Knowledge, because it is so broad', 'Skills, because they resist measuring', 'Attitude, because it resists checking', 'All three are equally well defined'], ans: _A2, exp: 'K and S are usually stated clearly and can be checked; A is hardest to observe. Week eight handles it.' },
    { q: 'How does this section relate to the term project?', opts: ['It is background and will not be used', 'It is the skeleton of the term project', 'The term project ignores industry structure', 'It only becomes relevant in week fifteen'], ans: _A1, exp: 'The agent collects an industry’s JDs, takes them apart with K/S/A, and answers what that field is hiring for.' }
  ],

  /* ---------- M3 Shape Yourself ---------- */
  m3_nav: '3. Shape Yourself',
  m3_title: 'Shape Yourself: turning four years into a foundation',
  m3_overview: 'With the world and the industry in view, turn the lens on yourself. Required courses, electives, the curriculum map and everything outside class can all become the foundation of a career — but they do not become it automatically. You have to connect them.',
  m3_highlights: ['Curriculum map', 'Projects', 'Competitions', 'Internships', 'PBL', 'SDL'],
  m3_p1: 'The first set of material is **coursework**: required courses, electives and the department’s curriculum map. The map is usually treated as a graduation checklist, but it is really a route map — it states what the department believes a graduate should become. You are allowed to disagree with it, but you have to read it first, or you cannot tell whether you are following it or wandering.',
  m3_p2: 'The second set is **everything outside class**: projects, competitions, internships, clubs, volunteering. Their value is not one more line on a CV. It is that they are among the few settings that force you to face a problem with no model answer. What an employer wants to hear is rarely what you took part in, but what went wrong there and how you handled it.',
  m3_p3: 'The third thing is **people**: your supervisor, students ahead of you, practitioners. You can obtain the first two sets on your own, but connecting them to a career usually requires somebody to tell you what you are currently missing. That does not happen by itself — you have to ask.',
  m3_p4: 'Two learning methods sit underneath this level. **PBL, problem-based learning**: start from a real problem rather than from a chapter. **SDL, self-directed learning**: you decide what to learn, how far, and how it gets checked. This entire course is designed on those two — class is only fifty minutes, everything else is outside it, and how you spend that time is your decision.',
  m3_svg_cap: 'The personal level: three sets of material feeding a career foundation, driven by PBL and SDL',
  m3_terms: [
    { front: 'Curriculum map', back: 'Usually treated as a graduation checklist; it is really the department’s route map for what a graduate should become. Disagree if you like, but read it first.' },
    { front: 'PBL · Problem-based learning', back: 'Start from a real problem rather than from a chapter. Every weekly worksheet in this course is built that way.' },
    { front: 'SDL · Self-directed learning', back: 'You decide what to learn, how far to take it, and how it gets checked. Class is fifty minutes; the weight of the course is outside it.' },
    { front: 'Value of activities', back: 'Not one more CV line, but one of the few settings that forces you to face a problem with no model answer. Employers ask what went wrong and how you handled it.' },
    { front: 'You have to ask', back: 'Coursework and activities you can obtain alone, but connecting them to a career usually needs someone to name what you are missing. It does not happen by itself.' }
  ],
  m3_wrapup: 'This level slides easily into motivational talk, so replace it with a concrete question: of what you already hold — courses taken, projects done, jobs worked — which one connects to the industry you want? And for the ones that do not, are they truly useless, or have you not yet found the connection?',
  m3_q: [
    { q: 'What does this section say a curriculum map is really for?', opts: ['Confirming you have enough credits', 'Reading what the department expects', 'Comparing difficulty across departments', 'Deciding whether to change your major'], ans: _A1, exp: 'It is a route map, not a checklist. Reading it tells you whether you are following it or wandering.' },
    { q: 'Where does the value of activities outside class lie?', opts: ['Making a CV look more impressive', 'Accumulating measurable contact hours', 'Facing problems with no model answer', 'Meeting more people in your own year'], ans: _A2, exp: 'Employers usually want to hear what went wrong there and how you handled it.' },
    { q: 'Where does problem-based learning start?', opts: ['From a chapter in the set textbook', 'From a real and existing problem', 'From the reading list a tutor sets', 'From a standardised written test'], ans: _A1, exp: 'From a real problem rather than a chapter. Every weekly worksheet follows that design.' },
    { q: 'What does self-directed learning emphasise?', opts: ['You decide the scope and the check', 'No teacher involvement is required', 'Learning faster than everyone else', 'Finding every source by yourself'], ans: _A0, exp: 'You decide what to learn, how far, and how it is checked. Most of the load sits outside class.' },
    { q: 'What does "it does not happen by itself" refer to?', opts: ['Asking someone to name what you lack', 'Finishing every assignment on time', 'Joining as many activities as you can', 'Going on exchange before you graduate'], ans: _A0, exp: 'Connecting your material to a career usually needs someone to tell you what you are missing.' }
  ],

  /* ---------- M4 Become a PM ---------- */
  m4_nav: '4. Become a Product Manager',
  m4_title: 'Become a product manager: where the three meet',
  m4_overview: 'See the world, understand industry, shape yourself — with all three in view, one role turns out to stand exactly where they intersect: the product manager. An international-business curriculum can look scattered, but inside this role it resolves into a coherent whole.',
  m4_highlights: ['Strategic thinking', 'Marketing acumen', 'Data-driven decisions', 'Coordination', 'Cross-cultural'],
  m4_p1: 'What a product manager does breaks into five parts. **Strategic thinking**: read market trends, analyse competitors, judge whether the thing should be built at all. **Marketing acumen**: identify customer needs and put a value proposition that persuades. **Data-driven decisions**: judge on evidence rather than instinct. **Cross-functional coordination**: pull R&D, design, marketing and operations together so the product travels from concept to launch. **Cross-cultural and international communication**: routinely underestimated in a global market.',
  m4_p2: 'Set those five against an international-business curriculum and the mapping is direct: strategic management meets strategic thinking, international marketing meets marketing acumen, financial analysis meets data-driven decisions, intercultural communication meets the last one. And cross-functional coordination is project management — which is what the second half of this course teaches.',
  m4_p3: 'So for a business student the PM role is not simply a job; it is a **stage**. It lets the business knowledge and analytical frameworks you learn in class land directly in industry practice. That is also why this course is called an introduction to project management and career strategy as a product manager: the first half is the role and the career, the second half is how you actually get something built.',
  m4_p4: 'One honest caveat. The PM role itself is changing. The old PM wrote the specification, set priorities and handed it to engineering. That boundary is now moving — which is precisely the third of the three shifts in the next section. So the list of competencies you just read is not a destination; it is a starting point that is already deforming.',
  m4_svg_cap: 'Where the three levels meet: five PM competencies and the courses that map to them',
  m4_terms: [
    { front: 'Product manager · PM', back: 'The role standing where the macro, industry and personal levels intersect. It needs strategic thinking, marketing acumen, data-driven decisions, coordination and cross-cultural communication.' },
    { front: 'Value proposition', back: 'Saying clearly whose problem this product solves and why you are the better one to solve it. The step immediately after identifying customer needs.' },
    { front: 'Cross-functional coordination', back: 'Pulling R&D, design, marketing and operations together so a product travels from concept to launch. This is project management — the second half of this course.' },
    { front: 'Why it is a stage', back: 'Because it lets classroom business knowledge and analytical frameworks land in industry practice, instead of stopping at a term report.' },
    { front: 'Stage-Gate', back: 'A new-product development model with a decision gate at the end of each stage: continue, revise or stop. One of the PM’s everyday decision settings.' }
  ],
  m4_wrapup: 'This section hands you a set of coordinates rather than an ambition. Even if you never become a PM, those five competencies and the courses behind them remain a ruler for judging what you are currently missing.',
  m4_q: [
    { q: 'The PM stands where which three levels intersect?', opts: ['Macro, industry, and personal', 'R&D, marketing, and operations', 'School, business, and government', 'Strategy, tactics, and execution'], ans: _A0, exp: 'See the world (macro), understand industry, shape yourself (personal) — the PM sits at their meeting point.' },
    { q: 'Putting a persuasive value proposition belongs to which part?', opts: ['Strategic thinking about trends', 'Marketing acumen and customer need', 'Data analysis as a decision basis', 'Cross-cultural communication work'], ans: _A1, exp: 'Identify the customer need first, then put a proposition that persuades.' },
    { q: 'Financial analysis maps most directly onto which part?', opts: ['Deciding on evidence, not instinct', 'Reading trends and rival companies', 'Coordinating R&D, design and ops', 'Handling cross-cultural situations'], ans: _A0, exp: 'Judging on data rather than instinct is the data-driven decisions part.' },
    { q: 'Cross-functional coordination maps onto what in this course?', opts: ['Channel management in marketing', 'Competitor analysis in strategy', 'Project management, second half', 'Cost control in financial analysis'], ans: _A2, exp: 'Pulling R&D, design, marketing and operations together is, in essence, project management.' },
    { q: 'What is the caveat at the end of this section?', opts: ['PM salaries run above the average', 'The PM role itself is changing now', 'PM suits business students only', 'PM requires ten years of seniority'], ans: _A1, exp: 'The competency list is a starting point already deforming — the third shift in the next section is about exactly that.' }
  ],

  /* ---------- M5 Three shifts ---------- */
  m5_nav: '5. Three shifts',
  m5_title: 'Three shifts: those levels are being rewritten',
  m5_overview: 'The four sections before this are the skeleton of the course, and the skeleton has not expired. But bring the clock to 2026 and all three levels are being rewritten by the same force. The usual way to talk about AI and work is to say a new industry has appeared — that framing will make you decide badly.',
  m5_highlights: ['AI agents', 'Physical AI', 'Roles reshaped', 'smart everything'],
  m5_p1: 'Start with the umbrella claim: **this is not one new industry, it is every existing industry rebuilt**. Manufacturing, retail, healthcare, logistics, finance and agriculture are each replacing their own processes with versions in which AI takes part in the decisions. So the question is not "should I switch into AI", it is "which part of my field is being rebuilt". Put it on the chain from section two: what is being rewritten is **department and position**; industry and company are still there.',
  m5_p2: '**Shift one lands on See the World: who is doing the buying?** For a century the base assumption of business models has been that people show up — to the shop, the ad, the price comparison. Marketing, brand and channel all draw their value from it. When comparing, ordering and renewing are handled by an AI agent, and nobody browses in person, does the brand premium survive? Can a channel still charge for shelf space? Who is the advertising for? You are a consumer yourself: start by counting how many of your own decisions you no longer make.',
  m5_p3: '**Shift two lands on Understand Industry: which kind of work changes first?** The comforting line of recent years was that AI takes desk jobs and hands-on work stays safe. Autonomous vehicles and humanoid robots retired that comfort — once AI leaves the screen and has a body, warehousing, delivery, inspection and cleaning all come into range. That does not mean everything is replaced. The real question is: where machines can both move and reason, which capabilities become more expensive?',
  m5_p4: '**Shift three lands on Shape Yourself and the PM: will the job I want still look like that?** The five competencies in the last section assume a PM who writes the specification and hands it to engineering. There is now a role called the **FDE, forward deployed engineer**, who takes the product straight to the customer’s site, understands the problem there, changes it there and delivers it there, without waiting for the next development cycle. That role is expanding into PM and project-manager territory. Which version of the job are you preparing for?',
  m5_p5: 'These three sit in week one not to make you an expert. They are here because the first assignment asks you to **take a position**, not to summarise one. You are allowed to be completely wrong, but you must commit — because in week sixteen you will read today’s answer again, and whether you see progress depends on whether you left something specific enough to be proved wrong.',
  m5_svg_cap: 'One shared premise, three tensions, each landing on one of the earlier levels',
  m5_terms: [
    { front: 'AI Agent', back: 'An AI that does not merely answer but carries out multi-step tasks for you: research, compare, order, track, report. It removes "a person operates this personally" from the business model.' },
    { front: 'Physical AI', back: 'AI with a body — humanoid robots, autonomous vehicles, automated warehousing. It changes the state of the physical world, not just produces text or images.' },
    { front: 'FDE · Forward deployed engineer', back: 'Takes the product to the customer’s site: understands, modifies and delivers there, without waiting for the next development cycle. Expanding into PM and project-manager territory.' },
    { front: 'Paradigm shift', back: 'Not the old way getting faster, but the shared sense of what counts as normal being replaced. The way to check it: no amount of efficiency in the old method catches up.' },
    { front: 'smart everything', back: 'Smart manufacturing, retail, healthcare, cities. What they share is not a new component but existing processes replaced by versions where AI takes part in the decisions.' },
    { front: 'Which layers move', back: 'On the chain from section two: industry and company largely remain, while department and position are what actually reorganise — rewriting every line of the JD.' }
  ],
  m5_wrapup: 'This section does not ask you to be right. It asks you to pick at least two of the three tensions and write something that could be proved wrong — not "AI will change a lot of things", which nobody would dispute, but something specific enough that you would defend it.',
  m5_q: [
    { q: 'What is "not one new industry" mainly warning you about?', opts: ['You should switch into AI quickly', 'Traditional industries will disappear', 'Existing industries rebuild inside', 'AI roles simply pay better money'], ans: _A2, exp: 'Existing industries are rebuilt from the inside, so the question is which part of your field is being rebuilt.' },
    { q: 'On the section-two chain, which layers actually reorganise?', opts: ['Industry and company', 'Department and position', 'Company and department', 'Position and the JD'], ans: _A1, exp: 'Industry and company largely remain; department and position reorganise, rewriting every JD line.' },
    { q: 'Which long-standing assumption does shift one unsettle?', opts: ['Consumers always chase lowest price', 'People show up to browse and compare', 'Brands always need to advertise', 'Channels need physical storefronts'], ans: _A1, exp: 'Marketing, brand and channel all draw value from "people show up"; agents loosen that premise.' },
    { q: 'What does this section claim about physical AI?', opts: ['All hands-on work will disappear', 'It has no effect in the near term', 'Only manufacturing is affected', 'Ask which capabilities gain value'], ans: _A3, exp: 'The text rejects "everything is replaced" and redirects to which capabilities become more expensive.' },
    { q: 'What most distinguishes an FDE from a traditional PM?', opts: ['Understands on site, changes, ships', 'Does not need to know the product', 'A different bonus and pay structure', 'Only exists at startup-sized firms'], ans: _A0, exp: 'The difference is the mode and tempo of delivery: no waiting for the next development cycle.' },
    { q: 'Why does the first assignment ask you to take a position?', opts: ['Positions are easier to grade fairly', 'Week sixteen compares against it', 'The instructor wants your values', 'Summaries are easy to catch copied'], ans: _A1, exp: 'With no position there is nothing to compare against, and no way to see progress.' }
  ],

  /* ---------- M6 Due on day one ---------- */
  m6_nav: '6. Due on day one',
  m6_title: 'The two things due on the first day',
  m6_overview: 'On the day of W1 you hand in two things, and they belong to **two different assignments**: **Part A of Worksheet W1** (three handwritten questions), and the **authentic version of the one-minute self-introduction** (a video). Both close at **23:59 that same day**, uploaded to the designated Moodle assignment. What they share is that neither may use AI, because both are "before" snapshots.',
  m6_highlights: ['Handwritten', 'One-minute video', 'No AI', '23:59 that day'],
  m6_partA: 'Worksheet W1 · Part A (three questions, by hand)',
  m6_a1: '**Question one · See the World**: pick two of the three tensions and write your position. Not a summary of those paragraphs — what you think will happen. It can be short, but it must be specific enough that somebody could disagree.',
  m6_a2: '**Question two · Understand Industry**: pick an industry you want to enter and use the chain from section two — say which department or which kind of position your two chosen tensions would change. If you cannot see what would change, that is a finding too; write it down honestly.',
  m6_a3: '**Question three · Shape Yourself**: given what you wrote, name the one concrete thing you will start doing this term. One only. "Read more" and "learn more skills" do not count — those are ideas you have not finished having. It has to be specific enough to start next week.',
  m6_wsnote: 'Worksheet W1 also has a **Part B**, and that one is the AI-assisted exercise your **group does together in the W2 class** — a different thing from the self-introduction video, so do not confuse the two. Part A is yours alone, without AI, due on the day of W1; Part B waits until you are in the W2 room.',
  m6_partB: 'Self-introduction video · the authentic one',
  m6_promise: 'This one is not graded, is not shown to the class, and is seen only by the instructor.',
  m6_promise_d: 'You do not have to be fluent, memorise a script, or re-record ten times. Stumbling, pausing and losing a word are all fine — that is what a "before" looks like. After the W2 class you will work with the SDL partner on a script and record again; that version is **shared within the class**, is equally ungraded, and closes at **23:59 on Tuesday 22 September**, the day before W3. Put the two side by side and the gap is the first concrete evidence this course gives you. The more honest the first, the more that evidence is worth.',
  m6_b1: 'Use the 4Q as your frame, and fit what a minute allows. (1) Who you are: personality, interests, family and upbringing. (2) What you have done outside class: jobs, internships, competitions, clubs, volunteering. (3) Why you chose this course and what your goal is. (4) What kind of help you most need right now. Questions three and four are the most useful to the instructor — take those seriously.',
  m6_b2: 'Your phone is enough. No equipment, no editing. Light enough to see you and sound clear enough to hear you is the whole requirement. The course’s self-introduction practice page has a built-in video and audio recorder, the 4Q prompts, and a CEFR self-assessment — rehearse there once first. The link is on the resources page.',
  m6_p1: 'Why does neither allow AI? Because almost every assignment in the following seventeen weeks uses AI, and uses it deeply. Precisely because of that, these two have to show you what is in your head and what your spoken English sounds like with no assistance at all. It is a baseline, not a punishment. Handwriting does one more practical thing: it slows you down. On a keyboard you drift into sentences that read smoothly and say nothing; with a pen you become concrete automatically, because you cannot be bothered to write filler.',
  m6_p2: 'What if it is not in by 23:59? I will advise you to drop the course promptly, and the TA will notify your department office. The reason is not punishment. General-education places are allocated by preference and ballot, this course is capped at thirty-six, and there is a queue behind your place. If the most basic first assignment did not arrive, the seat is better given to someone who wants it — and the earlier it is released, the better the chance the next person catches up.',
  m6_p3: 'If you came in from the waiting list and were not in the room for W1, you still owe both, before the W2 class. If you want the instructor to sign you in personally, have both ready as well; whether to sign is the instructor’s judgement.',
  m6_terms: [
    { front: 'Why by hand', back: 'It slows you down, which stops the smooth-but-empty sentences, and it produces a "before" snapshot that AI could not have ghost-written.' },
    { front: 'Why no AI', back: 'Week sixteen compares against what you produce today. If AI wrote it, you would be measuring AI’s progress rather than your own.' },
    { front: 'The 4Q', back: 'Who you are / what you have done / why this course and your goal / the help you most need. The third and fourth are the most useful to the instructor.' },
    { front: 'Not graded, not public', back: 'The authentic video is seen only by the instructor, is not shown to the class, and carries no marks. Stumbling is entirely fine.' },
    { front: 'One concrete thing', back: 'Question three allows exactly one, specific enough to start next week. "Read more" is an idea you have not finished having.' },
    { front: 'Disagreeable', back: 'A good position is one somebody could disagree with. A claim nobody disputes — "AI will change a lot" — is the same as saying nothing.' },
    { front: 'Part A is not the video', back: 'Part A is the first half of Worksheet W1; the worksheet\u2019s Part B is the group AI exercise in the W2 class. The self-introduction video is a separate assignment altogether.' }
  ],
  m6_wrapup: 'For both, what matters is that they exist, not that they are good. They are baselines, not exams. The version that gets assessed comes in week sixteen, and by then you will be glad you left honest ones today.',
  m6_q: [
    { q: 'When are the two day-one items due?', opts: ['23:59 on the day of W1', 'The day before the W2 class', 'The add-drop closing date', 'One week after the first class'], ans: _A0, exp: 'Both go to the designated Moodle assignment by 23:59 on the day of the W1 class.' },
    { q: 'How are the three questions handed in?', opts: ['Filled in on an online form', 'Typed up and uploaded as a file', 'Handwritten, photographed, uploaded', 'Answered aloud during the class'], ans: _A2, exp: 'Written by hand on iPad or paper, photographed clearly, uploaded to Moodle.' },
    { q: 'How many things does question three ask for?', opts: ['One, ready to start next week', 'Three, ranked by importance', 'Five, covering all four years', 'No limit — the more the better'], ans: _A0, exp: 'Exactly one, and concrete enough to begin next week.' },
    { q: 'Which is true of the authentic video?', opts: ['It is played to the whole class', 'Instructor only, and not graded', 'It counts for ten per cent of marks', 'It needs an AI-written script first'], ans: _A1, exp: 'Not graded, not shown to the class, seen only by the instructor — so stumbling does not matter.' },
    { q: 'What does this page say happens if you miss the deadline?', opts: ['Participation marks are deducted', 'You may make it up orally later', 'Advised to drop; department told', 'There is no consequence at all'], ans: _A2, exp: 'The reason is fairness to the queue: the earlier the seat is released, the better the next person catches up.' },
    { q: 'You came off the waiting list and missed W1. What now?', opts: ['Neither item needs handing in', 'Hand both in at end of term', 'Hand both in before W2 class', 'Only the video is still required'], ans: _A2, exp: 'Both the handwritten questions and the authentic video, before the W2 class.' },
    { q: 'What is Part B of Worksheet W1?', opts: ['The group AI exercise in W2 class', 'The one-minute video due on day one', 'The personal details form before W1', 'A written reflection at end of term'], ans: _A0, exp: 'Part B is done by your group inside the W2 class, and has nothing to do with the self-introduction video.' }
  ],

  /* ---------- M7 Three checks ---------- */
  m7_nav: '7. Three checks',
  m7_title: 'This page will not tell you the state of play',
  m7_overview: 'You may have noticed that the section on the three shifts named no company, no robot, no process node and no number. That is deliberate. This page does not tell you how things stand — it tells you how to find out, because by the year you graduate every specific figure written here will have expired.',
  m7_highlights: ['Check the date', 'Find the primary source', 'Find the dissent'],
  m7_p1: '**Check one · the date.** For any claim about AI, find out when it was written. This field turns over roughly every six months; a two-year-old analysis may have lost its premises entirely. Treat undated content as untrustworthy by default. The rule looks too simple to matter, and it will filter out most of the rubbish you meet. Worth adding: AI has this problem too — its training data has a cut-off, and it will not spontaneously tell you which day its knowledge stops.',
  m7_p2: '**Check two · the primary source.** Most claims reach you second, third or fifth hand. Every retelling drops a qualifier, and at the end you get a sentence like "research shows AI will replace 40% of jobs" with no way of knowing where it came from. Trace it back: who did it, what was the sample, how were the terms defined? If you cannot reach a primary source, treat the claim as not yet established.',
  m7_p3: '**Check three · the dissent.** If everything you find points the same way, that is usually not because the question is settled — it is because your way of searching only surfaces one kind of answer. Go looking for what people who disagree actually say. Not for balance, but because the dissent will tell you directly where the argument is weakest. What you are judging is strength, not volume.',
  m7_p4: 'Why teach this in week one? Because this course uses AI heavily from here on, and what AI is best at producing is content that sounds reasonable, carries no date, cites nothing traceable, and contains no opposing view. These three checks are the filter you will use every week. By week ten, when we reach context engineering, you will recognise them as its first draft.',
  m7_terms: [
    { front: 'Check the date', back: 'The field turns over about every six months, so undated content is untrustworthy by default. AI has a training cut-off it will not volunteer either.' },
    { front: 'Find the primary source', back: 'Every retelling drops a qualifier. Trace it back: who did it, how large the sample, how the terms were defined. If you cannot, treat it as unestablished.' },
    { front: 'Find the dissent', back: 'Everything pointing one way usually means your search is biased. Dissent points straight at the weakest part of an argument.' },
    { front: 'Strength, not volume', back: 'A claim being repeated often and a claim standing up to scrutiny are two entirely different things.' }
  ],
  m7_wrapup: 'These are not academic conventions; they are self-defence. Run every claim you find in this course, and every answer AI hands you, through all three first. Anything that does not survive should not go into your assignment yet.',
  m7_q: [
    { q: 'Why does this page avoid naming companies and figures?', opts: ['To avoid copyright complications', 'Specifics expire; methods do not', 'First-year students would be lost', 'The instructor lacks the figures'], ans: _A1, exp: 'By the year you graduate every figure written now has expired. Method outlasts answers.' },
    { q: 'Why does "check the date" matter especially here?', opts: ['It makes sorting by time easier', 'Press releases always carry dates', 'The field turns over each half-year', 'The instructor checks citations'], ans: _A2, exp: 'A two-year-old analysis may have lost its premises; AI also has a training cut-off.' },
    { q: 'What problem does "find the primary source" address?', opts: ['Retelling drops the qualifiers', 'Primary sources are cheap to get', 'Second-hand sources are all false', 'There is too much to read'], ans: _A0, exp: 'Each retelling loses conditions until the claim cannot be traced. Ask who, what sample, what definition.' },
    { q: 'Everything you find points one way. What should you do?', opts: ['Accept it — there is consensus', 'Go and look for the dissent', 'Change to a different topic', 'Believe the most repeated one'], ans: _A1, exp: 'It may be your search that is biased; dissent points at the weakest part of the argument.' },
    { q: 'These three checks become what by week ten?', opts: ['The term project marking rubric', 'The presentation scoring sheet', 'Context engineering, in draft', 'A bonus-mark opportunity'], ans: _A2, exp: 'When the course reaches context engineering you will recognise these three as its first draft.' }
  ],

  m8_rhythm: 'The weekly rhythm',
  m8_rhythm_d: 'From last Wednesday’s class to 23:59 this Tuesday you have six days: read the required material yourself, fill in your own sections of the worksheet, meet your group to consolidate one version, upload it to Moodle by Tuesday night. On Wednesday morning the TA consolidates and the instructor reads it and decides where to aim. The fifty minutes that afternoon then does only three things — a demonstration, two group presentations, and diagnosis of whatever you are stuck on. Class is not for delivering content; it is for unblocking what you could not finish outside it.',
  m8_add: 'Adding the class',
  m8_add_1: 'If you came off the waiting list: hand in the three handwritten questions and the one-minute authentic video before the W2 class. The TA will follow up.',
  m8_add_2: 'If you want the instructor to sign you in personally: have both pieces ready first. Whether to sign is the instructor’s judgement.',
  m8_after: 'What W2 unlocks',
  m8_after_d: 'In the second class you get the passphrase for the course hub. That is where the full eighteen-week material map lives, along with twelve interactive worksheets, the term-project specification, the assessment and submission rules, the AI-use and data-ethics statement, and the setup guide for the SDL learning partner — a course-specific instruction file that turns your AI into a study partner that asks you questions instead of handing you answers. This page is the entrance, not the building.',
  m8_p1: 'On grading: the weight sits on the weekly worksheets, the group presentations and the acceptance of the term project, not on a final exam. The detail lives behind the passphrase, but the principle can be said now — this course assesses what you built and whether it runs again, not what you memorised.',
  m8_p2: 'On teams: groups form in week two and are deliberately mixed across departments and year groups. This is a general-education course, so a fourth-year computer-science student and a first-year Chinese-literature student may well be in the same room — and the term project needs exactly that mixture, because it needs someone who asks the right question as much as someone who can make the thing work. Every group is guaranteed at least one member with interest or experience in the tooling. If you cannot code, you are not there to make up the numbers; if you can, you are not there to be the group’s hired hand.',
  m8_terms: [
    { front: 'One credit, three credits’ time', back: 'Fifty minutes in class, at least two hours outside. This is the expected commitment stated in the syllabus — do the arithmetic before you decide.' },

    { front: 'SDL learning partner', back: 'A course-specific instruction file that turns your AI into a partner that questions you, and produces a knowledge base you can hand in. Installed after the W2 passphrase.' },
    { front: 'Mixed teams', back: 'Deliberately mixed by department and year. The term project needs someone who asks the right question as much as someone who can build.' },
    { front: 'Class as a clinic', back: 'The fifty minutes is a demonstration, two presentations and stuck-point diagnosis — not a lecture from scratch. The learning happens in the six days outside.' }

  m8_wrapup: 'You now have enough. What this course wants is clear and it is not light, but eighteen weeks later you will have something that genuinely runs and a record that proves you improved. If that sounds like what you want, see you in W1. If not, please release the place early to someone in the queue.',
  m8_q: [
    { q: 'How much time outside class does the course expect?', opts: ['Around thirty minutes', 'At least two full hours', 'Five hours and upwards', 'Nothing is specified'], ans: _A1, exp: 'A one-credit course asking for three credits’ worth: reading and worksheet, group discussion, consolidation.' },
    { q: 'What are the Wednesday fifty minutes mainly for?', opts: ['Lecturing the week from scratch', 'Demonstration, talks, diagnosis', 'Quizzes and in-class testing', 'Silent study and homework'], ans: _A1, exp: 'Class is a clinic, not a lecture. The real work is the six days outside it.' },
    { q: 'When is the course hub passphrase issued?', opts: ['At the end of the W1 class', 'During the W2 class itself', 'Mid-semester by email later', 'After the project is accepted'], ans: _A1, exp: 'In week two, to students who have confirmed enrolment. This page is the entrance, not the building.' },
    { q: 'What is the grouping principle in this course?', opts: ['Group by related departments', 'Students form their own teams', 'Deliberately mixed field and year', 'Assigned at random by number'], ans: _A2, exp: 'The project needs someone who asks the right question and someone who builds; each group has one tooling-capable member.' },
    { q: 'When does a free AI plan stop being enough?', opts: ['Immediately, from week one', 'Around week ten, at the build', 'It stays sufficient all term', 'The week before final review'], ans: _A1, exp: 'Free plans just about survive the early weeks and stall when the morning-brief agent build begins.' }

const MD = ({ s }) => {
  if (!s) return null;
  const parts = String(s).split(/\*\*(.+?)\*\*/g);
  return <>{parts.map((x, i) => i % 2 ? <strong key={i} className="font-bold text-slate-900 dark:text-white">{x}</strong> : <React.Fragment key={i}>{x}</React.Fragment>)}</>;
};

/* ---------- 翻轉學習卡：每次從剩餘卡片隨機抽 2 張 ---------- */
const FlipCardDeck = ({ terms, t, moduleId, onCardRead }) => {
  const [groupIdx, setGroupIdx] = useState(0);
  const [flipped, setFlipped] = useState({});
  const [readSet, setReadSet] = useState(() => new Set());
  const [shownSet, setShownSet] = useState(() => new Set());
  const [order] = useState(() => [...Array(terms.length).keys()].sort(() => Math.random() - 0.5));

  const groupSize = 2;
  const totalGroups = Math.ceil(terms.length / groupSize);
  const start = groupIdx * groupSize;
  const current = order.slice(start, start + groupSize);

  useEffect(() => {
    const next = new Set(shownSet);
    current.forEach(i => next.add(i));
    if (next.size !== shownSet.size) setShownSet(next);
  }, [groupIdx]);

  const handleFlip = (i) => {
    setFlipped(f => ({ ...f, [i]: !f[i] }));
    if (!readSet.has(i)) {
      const next = new Set(readSet); next.add(i); setReadSet(next);
      if (onCardRead) onCardRead(moduleId, next.size, shownSet.size, terms.length);
    }
  };

  const status = t.flip_status
    .replace('{read}', readSet.size).replace('{shown}', shownSet.size).replace('{total}', terms.length);

  return (
    <div className="mt-8">
      <h3 className="text-sm font-bold uppercase tracking-wider text-slate-600 dark:text-slate-400 mb-2">{t.key_terms}</h3>
      <p className="text-sm text-slate-600 dark:text-slate-400 mb-4">{status}</p>
      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
        {current.map(i => {
          const term = terms[i];
          return (
            <div key={i} className="perspective cursor-pointer h-44 sm:h-40" onClick={() => handleFlip(i)}>
              <div className={`transform-style-3d relative w-full h-full transition-transform duration-500 ${flipped[i] ? 'rotate-y-180' : ''}`}>
                <div className="backface-hidden absolute inset-0 bg-white dark:bg-slate-800 rounded-xl p-4 flex flex-col items-center justify-center border border-slate-200 dark:border-slate-700 shadow-sm">
                  <p className="font-serif font-bold text-center text-[#004030] dark:text-[#D8C3A5]">{term.front}</p>
                  <p className="text-xs text-slate-600 dark:text-slate-400 mt-2 ui-decoration">{t.flip_prompt}</p>
                </div>
                <div className="backface-hidden rotate-y-180 absolute inset-0 bg-[#004030] rounded-xl p-4 flex items-center justify-center overflow-y-auto">
                  <p className="text-[13px] text-center text-[#F1E7D8] leading-relaxed">{term.back}</p>
                </div>
              </div>
            </div>
          );
        })}
      </div>
      <div className="flex items-center gap-3 mt-4">
        <button onClick={() => { setGroupIdx(0); setFlipped({}); }}
          className="px-4 py-2 text-sm border border-slate-400 dark:border-slate-600 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700">
          {t.flip_retry}
        </button>
        <button onClick={() => groupIdx < totalGroups - 1 && setGroupIdx(groupIdx + 1)}
          disabled={groupIdx >= totalGroups - 1}
          className="px-4 py-2 text-sm bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg disabled:opacity-40">
          {t.flip_next}
        </button>
      </div>
    </div>
  );
};

/* ---------- 模組檢定：每次從剩餘題目隨機抽 2 題，選項獨立洗牌 ---------- */
const ModuleQuiz = ({ questions, t, moduleId, onQuizSubmit, moduleName }) => {
  const [selected, setSelected] = useState({});
  const [submitted, setSubmitted] = useState({});
  const [groupIdx, setGroupIdx] = useState(0);
  const groupSize = 2;

  const [qOrder] = useState(() => [...Array(questions.length).keys()].sort(() => Math.random() - 0.5));
  const [optMaps] = useState(() => qOrder.map(qi => [...Array(questions[qi].opts.length).keys()].sort(() => Math.random() - 0.5)));
  const totalGroups = Math.ceil(qOrder.length / groupSize);

  const countCorrect = () => {
    let c = 0;
    qOrder.forEach((qi, k) => {
      if (selected[k] === undefined) return;
      if (optMaps[k][selected[k]] === _d(questions[qi].ans)) c++;
    });
    return c;
  };
  const status = t.quiz_status
    .replace('{correct}', countCorrect())
    .replace('{answered}', Object.keys(selected).length)
    .replace('{total}', qOrder.length);

  const start = groupIdx * groupSize;
  const current = qOrder.slice(start, start + groupSize);

  const handleSubmit = () => {
    if (!current.every((_, i) => selected[start + i] !== undefined)) return;
    const nextSub = { ...submitted, [groupIdx]: true };
    setSubmitted(nextSub);
    if (Object.keys(nextSub).length === totalGroups) {
      const wrong = []; let c = 0;
      qOrder.forEach((qi, k) => {
        if (selected[k] === undefined) return;
        if (optMaps[k][selected[k]] === _d(questions[qi].ans)) c++;
        else wrong.push(questions[qi].q);
      });
      onQuizSubmit(moduleId, c, qOrder.length, wrong, moduleName);
    }
  };

  return (
    <div className="mt-8 bg-slate-100 dark:bg-slate-900/50 rounded-2xl p-5 sm:p-6 border border-slate-200 dark:border-slate-700">
      <h3 className="text-lg font-bold font-serif text-[#004030] dark:text-[#D8C3A5] mb-2">{t.quiz_title}</h3>
      <p className="text-sm text-slate-600 dark:text-slate-400 mb-6">{status}</p>
      {current.map((qi, li) => {
        const k = start + li;
        const q = questions[qi];
        const map = optMaps[k];
        const done = !!submitted[groupIdx];
        const isRight = done && selected[k] !== undefined && map[selected[k]] === _d(q.ans);
        return (
          <div key={qi} className="mb-6">
            <p className="font-bold mb-3">{k + 1}. {q.q}</p>
            <div className="space-y-2">
              {map.map((orig, di) => {
                const right = orig === _d(q.ans);
                const sel = selected[k] === di;
                return (
                  <button key={di} onClick={() => !done && setSelected(s => ({ ...s, [k]: di }))}
                    className={`w-full text-left px-4 py-3 rounded-lg border transition-all text-sm
                      ${done
                        ? right ? 'bg-green-100 dark:bg-green-900/40 border-green-600 dark:border-green-500'
                          : sel ? 'bg-red-100 dark:bg-red-900/40 border-red-500' : 'border-slate-300 dark:border-slate-700'
                        : sel ? 'border-[#004030] dark:border-[#D8C3A5] bg-[#004030]/10 dark:bg-[#D8C3A5]/10'
                          : 'border-slate-300 dark:border-slate-700 hover:border-slate-500 dark:hover:border-slate-500'}`}>
                    {q.opts[orig]}
                  </button>
                );
              })}
            </div>
            {done && (
              <p className={`mt-2 text-sm ${isRight ? 'text-green-700 dark:text-green-400' : 'text-red-600 dark:text-red-400'}`}>
                {isRight ? `✓ ${t.correct}` : `✗ ${t.incorrect}`} — {t.explanation}：{q.exp}
              </p>
            )}
          </div>
        );
      })}
      <div className="flex flex-wrap items-center gap-3">
        {!submitted[groupIdx]
          ? <button onClick={handleSubmit}
              disabled={!current.every((_, i) => selected[start + i] !== undefined)}
              className="px-6 py-2 bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg disabled:opacity-40">
              {t.submit}
            </button>
          : <>
              {groupIdx < totalGroups - 1 && (
                <button onClick={() => setGroupIdx(groupIdx + 1)}
                  className="px-6 py-2 bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg">
                  {t.quiz_next}
                </button>
              )}
              <button onClick={() => { setGroupIdx(0); setSelected({}); setSubmitted({}); }}
                className="px-6 py-2 border border-[#004030] dark:border-[#D8C3A5] text-[#004030] dark:text-[#D8C3A5] font-bold rounded-lg">
                {t.quiz_retry}
              </button>
            </>}
      </div>
    </div>
  );
};

const LabCountdown = ({ t }) => {

  const diff = target - now;

  const s = Math.max(0, Math.floor(diff / 1000));
  const parts = [

/* Lab 4 · 三條原則練習 */
const LabChecks = ({ t, bump }) => {
  const [idx, setIdx] = useState(0);
  const [picked, setPicked] = useState({});
  const [shown, setShown] = useState(false);
  const c = t.lab4_cases[idx];
  const right = useMemo(() => {
    const want = new Set(c.flaws);
    const got = new Set(Object.keys(picked).filter(k => picked[k]).map(Number));
    if (want.size !== got.size) return false;
    for (const v of want) if (!got.has(v)) return false;
    return true;
  }, [picked, idx]);
  const next = () => { setIdx(i => (i + 1) % t.lab4_cases.length); setPicked({}); setShown(false); bump(); };
  return (
    <div className="bg-white dark:bg-slate-800 rounded-xl p-5 border border-slate-200 dark:border-slate-700">
      <h4 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5] mb-1">{t.lab4_title}</h4>

          <button key={i} onClick={() => { if (!shown) { setPicked(p => ({ ...p, [i]: !p[i] })); bump(); } }}
            className={`w-full text-left flex items-start gap-3 px-4 py-2.5 rounded-lg border text-[13px] transition-colors
              ${shown && c.flaws.indexOf(i) !== -1 ? 'border-green-600 bg-green-50 dark:bg-green-900/30'
                : picked[i] ? 'border-[#004030] dark:border-[#D8C3A5] bg-[#004030]/10 dark:bg-[#D8C3A5]/10'

          </button>
        ))}
      </div>
      <div className="flex flex-wrap gap-2 mt-4">
        <button onClick={() => { setShown(true); bump(); }}
          className="px-4 py-2 text-sm bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg">
          {t.lab4_check}
        </button>
        <button onClick={next}
          className="px-4 py-2 text-sm border border-slate-400 dark:border-slate-600 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700">
          {t.lab4_again}

      {shown && (
        <div className={`mt-3 p-4 rounded-lg border-l-4 ${right ? 'border-green-600 bg-green-50 dark:bg-green-900/30' : 'border-amber-600 bg-amber-50 dark:bg-amber-900/30'}`}>

  );
};

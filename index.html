/* 每個學習模組對應的圖示元件；沒有的就不畫 */
const SVG_OF = { 1: MacroMap, 2: IndustryChain, 3: PersonalMap, 4: PMMap, 5: TensionMap };

/* ==================== 主程式 ==================== */
function App() {
  const LS_KEY = 'PMCS_W1_progress';
  const loadLS = (k, fb) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch (e) { return fb; } };
  /* 單元數改變過，舊瀏覽器裡存的陣列會比 TOTAL 短，讀到 undefined 後相加就變成 NaN。
     載入時一律補齊長度並把非數值歸零，這樣改版不會讓學生看到 NaN。 */
  const fixArr = (a, len, zero) => Array.from({ length: len }, (_, i) => {
    const v = Array.isArray(a) ? a[i] : undefined;
    if (zero === false) return v === true;
    return Number.isFinite(v) ? v : 0;
  });
  const migrate = (p) => ({
    time: fixArr(p && p.time, TOTAL), clicks: fixArr(p && p.clicks, TOTAL),
    quizCorrect: fixArr(p && p.quizCorrect, TOTAL), quizTotal: fixArr(p && p.quizTotal, TOTAL),
    cardsRead: fixArr(p && p.cardsRead, TOTAL), cardsTotal: fixArr(p && p.cardsTotal, TOTAL),
    visited: fixArr(p && p.visited, TOTAL, false),
    wrong: (p && p.wrong && typeof p.wrong === 'object') ? p.wrong : {}
  });

  const [lang, setLang] = useState('en');
  const [isDark, setIsDark] = useState(true);
  const [module, setModule] = useState(0);
  const [menuOpen, setMenuOpen] = useState(false);
  const [ttsState, setTtsState] = useState('idle');
  const [prog, setProg] = useState(() => migrate(loadLS(LS_KEY, null)));
  const menuRef = useRef(null);
  const t = dict[lang];

  useEffect(() => { document.documentElement.classList.toggle('dark', isDark); }, [isDark]);
  useEffect(() => { document.documentElement.lang = (lang === 'zh' ? 'zh-Hant-TW' : 'en'); }, [lang]);
  useEffect(() => { try { localStorage.setItem(LS_KEY, JSON.stringify(prog)); } catch (e) {} }, [prog]);

  /* 停留時間：每秒累加到當前單元 */
  useEffect(() => {
    setProg(p => { if (p.visited[module]) return p; const v = [...p.visited]; v[module] = true; return { ...p, visited: v }; });
    const id = setInterval(() => {
      if (document.visibilityState === 'hidden') return;
      setProg(p => { const tm = [...p.time]; tm[module] += 1; return { ...p, time: tm }; });
    }, 1000);
    return () => clearInterval(id);
  }, [module]);

  const bump = () => setProg(p => { const c = [...p.clicks]; c[module] += 1; return { ...p, clicks: c }; });

  useEffect(() => {
    const h = (e) => { if (menuRef.current && !menuRef.current.contains(e.target)) setMenuOpen(false); };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, []);

  const handleQuizSubmit = (mid, correct, total, wrongQs) => {
    setProg(p => {
      const qc = [...p.quizCorrect], qt = [...p.quizTotal];
      qc[mid] = correct; qt[mid] = total;
      const w = { ...p.wrong }; w[mid] = wrongQs || [];
      return { ...p, quizCorrect: qc, quizTotal: qt, wrong: w };
    });
  };
  const handleCardRead = (mid, read, shown, total) => {
    setProg(p => {
      const cr = [...p.cardsRead], ct = [...p.cardsTotal];
      cr[mid] = read; ct[mid] = total;
      return { ...p, cardsRead: cr, cardsTotal: ct };
    });
  };

  const modules = useMemo(() => {
    const a = [{ id: 0, nav: t.m0_nav }];
    for (let i = 1; i <= NUM_LEARN; i++) a.push({ id: i, nav: t[`m${i}_nav`] });
    a.push({ id: IDX_LAB, nav: t.mlab_nav });
    a.push({ id: IDX_RES, nav: t.mres_nav });
    a.push({ id: IDX_ANA, nav: t.ana_nav });
    return a;
  }, [lang]);

  const go = (i) => { setModule(i); setMenuOpen(false); window.scrollTo({ top: 0, behavior: 'smooth' }); };

  /* ============ 語音導覽（強化版：抗 Chrome 三個已知毛病） ============ */
  const ttsUtter = useRef(null);
  const ttsKeep = useRef(null);
  const ttsWatch = useRef(null);
  const ttsClearTimers = () => {
    if (ttsKeep.current) { clearInterval(ttsKeep.current); ttsKeep.current = null; }
    if (ttsWatch.current) { clearInterval(ttsWatch.current); ttsWatch.current = null; }
  };
  /* 一定要先 resume 再 cancel：在 paused 狀態下 cancel，Chrome 的語音引擎會一直卡在暫停，
     之後每一次 speak() 都只會靜靜排隊，整頁看起來像壞掉。 */
  const ttsHardReset = () => {
    try { speechSynthesis.resume(); } catch (e) {}
    try { speechSynthesis.cancel(); } catch (e) {}
    ttsClearTimers();
    ttsUtter.current = null;
  };
  useEffect(() => () => ttsHardReset(), []);
  useEffect(() => { if (ttsState !== 'idle') { ttsHardReset(); setTtsState('idle'); } }, [module, lang]);

  const ttsTexts = () => {
    const out = [];
    const put = (x) => { if (x) out.push(String(x)); };
    if (module === 0) {
      [t.m0_title, t.m0_intro, t.m0_why, t.m0_why_desc].forEach(put);
      (t.m0_stats || []).forEach(s => put(`${s.val} ${s.label}`));
      put(t.m0_endpoint); put(t.m0_endpoint_desc);
      (t.m0_modules || []).forEach(m => put(`${m.title}. ${m.desc}`));
    } else if (module >= 1 && module <= NUM_LEARN) {
      const k = `m${module}`;
      put(t[`${k}_title`]); put(t[`${k}_overview`]);
      (t[`${k}_highlights`] || []).forEach(put);
      [1, 2, 3, 4, 5].forEach(n => put(t[`${k}_p${n}`]));
      if (module === 6) {
        put(t.m6_partA); [t.m6_a1, t.m6_a2, t.m6_a3].forEach(put);
        put(t.m6_wsnote);
        put(t.m6_partB); put(t.m6_promise); put(t.m6_promise_d);
        put(t.m6_b1); put(t.m6_b2);
      }
      if (module === 8) {
        put(t.m8_gate);
        (t.m8_gates || []).forEach(g => put(`${g.t}. ${g.d}`));
        put(t.m8_rhythm); put(t.m8_rhythm_d);
        put(t.m8_add); put(t.m8_add_1); put(t.m8_add_2);
        put(t.m8_after); put(t.m8_after_d);
      }
      (t[`${k}_terms`] || []).forEach(x => { put(x.front); put(x.back); });
      put(t[`${k}_wrapup`]);
    } else if (module === IDX_LAB) {
      put(t.mlab_title); put(t.mlab_desc);
      (t.mlab_labs || []).forEach(l => put(`${l.title}. ${l.desc}`));
    } else if (module === IDX_RES) {
      put(t.mres_title); put(t.mres_desc);
      RES.forEach(r => put(`${r.label}. ${lang === 'zh' ? r.zh : r.en}`));
    } else {
      put(t.ana_title); put(t.ana_desc); put(t.ana_privacy);
      const tc = prog.quizCorrect.reduce((a, b) => a + b, 0);
      const ta = prog.quizTotal.reduce((a, b) => a + b, 0);
      put(`${t.ana_overall_acc}: ${ta > 0 ? Math.round(tc / ta * 100) : 0}%`);
      const weak = [];
      for (let i = 1; i <= NUM_LEARN; i++) {
        if (prog.quizTotal[i] > 0) {
          const acc = Math.round(prog.quizCorrect[i] / prog.quizTotal[i] * 100);
          if (acc < 75) weak.push({ name: t[`m${i}_title`], acc });
        }
      }
      if (weak.length) {
        put(t.ana_wp_tts_intro);
        weak.forEach(w => put(t.ana_wp_tts_module.replace('{name}', w.name).replace('{acc}', w.acc)));
      } else if (ta > 0) put(t.ana_wp_tts_allpass);
    }
    return out.filter(Boolean);
  };

  const handleTTS = (action) => {
    if (!('speechSynthesis' in window)) return;
    if (action === 'stop') { ttsHardReset(); setTtsState('idle'); return; }
    if (action === 'pause') { try { speechSynthesis.pause(); } catch (e) {} setTtsState('paused'); return; }
    if (ttsState === 'paused') { try { speechSynthesis.resume(); } catch (e) {} setTtsState('playing'); return; }

    ttsHardReset();
    const sep = lang === 'zh' ? '。' : '. ';
    const full = ttsTexts().join(sep);
    const limit = lang === 'zh' ? 140 : 190;
    /* 先切句，再把「單一句就超過上限」的長句硬切開——只靠句號分段，
       遇到一個特別長的句子會整段送進 speak()，Chrome 會念到一半自己停掉。 */
    const hardSplit = (s) => {
      const out = [];
      let rest = s;
      while (rest.length > limit) {
        let cut = -1;
        if (lang === 'zh') {
          cut = Math.max(rest.lastIndexOf('，', limit), rest.lastIndexOf('、', limit),
                         rest.lastIndexOf('；', limit), rest.lastIndexOf('：', limit));
        } else {
          cut = Math.max(rest.lastIndexOf(', ', limit), rest.lastIndexOf('; ', limit),
                         rest.lastIndexOf(' — ', limit), rest.lastIndexOf(' ', limit));
        }
        if (cut < limit * 0.4) cut = limit;      /* 找不到好的切點就硬切 */
        out.push(rest.slice(0, cut + 1).trim());
        rest = rest.slice(cut + 1).trim();
      }
      if (rest) out.push(rest);
      return out;
    };
    const chunks = [];
    let buf = '';
    full.split(lang === 'zh' ? /(?<=[。！？；])/ : /(?<=[.!?;])\s+/).forEach(seg => {
      if ((buf + seg).length > limit) {
        if (buf) { chunks.push(buf); buf = ''; }
        if (seg.length > limit) { hardSplit(seg).forEach(x => chunks.push(x)); return; }
      }
      buf += seg;
    });
    if (buf.trim()) chunks.push(buf);
    if (!chunks.length) return;

    /* 語音挑選：與課程既有 SPA 完全一致，不做任何更動 */
    const voices = speechSynthesis.getVoices();
    let voice = null, code = 'en-GB';
    if (lang === 'zh') {
      voice = voices.find(v => v.lang === 'zh-TW' && v.name.includes('Yating')) || voices.find(v => v.lang === 'zh-TW') || voices.find(v => v.lang.startsWith('zh')) || null;
      code = 'zh-TW';
    } else {
      voice = voices.find(v => v.lang === 'en-GB' && (v.name.includes('Male') || v.name.includes('Daniel'))) || voices.find(v => v.lang === 'en-GB') || voices.find(v => v.lang.startsWith('en')) || null;
      code = 'en-GB';
    }

    let i = 0, started = false, revives = 0;
    const finish = () => { ttsHardReset(); setTtsState('idle'); };
    const speakNext = () => {
      if (i >= chunks.length) { finish(); return; }
      const u = new SpeechSynthesisUtterance(chunks[i++]);
      u.rate = 0.95; u.lang = code; if (voice) u.voice = voice;
      u.onstart = () => { started = true; };
      u.onend = () => { if (ttsUtter.current === u) speakNext(); };
      u.onerror = () => finish();
      ttsUtter.current = u;           /* 保住強引用：被 GC 掉的 utterance 永遠不會觸發 onend */
      speechSynthesis.speak(u);
    };
    speakNext();
    setTtsState('playing');

    /* 保活只對桌機 Chrome 有意義：它大約 15 秒後會自己靜下來，pause/resume 戳一下就會醒。
       但手機（iOS Safari 尤其）相反——由計時器發出的 pause() 不是使用者手勢，
       resume() 不一定生效，結果就是「唸幾秒就停住」。所以行動裝置一律不裝這個保活。 */
    if (!IS_TOUCH) {
      ttsKeep.current = setInterval(() => {
        try {
          if (!speechSynthesis.speaking || speechSynthesis.paused) return;
          speechSynthesis.pause(); speechSynthesis.resume();
        } catch (e) {}
      }, 8000);
    }

       但「還有段落沒唸完」和「唸完了」要分開處理——手機在兩段之間常有較長空檔，

       還有剩就重新推一次，真的推不動才收工。 */
    let idle = 0;
    const IDLE_LIMIT = started ? (IS_TOUCH ? 8 : 3) : (IS_TOUCH ? 40 : 30);
    ttsWatch.current = setInterval(() => {
      try {
        if (speechSynthesis.speaking || speechSynthesis.pending || speechSynthesis.paused) { idle = 0; return; }
      } catch (e) { return; }
      idle += 1;
      if (idle < (started ? (IS_TOUCH ? 8 : 3) : (IS_TOUCH ? 40 : 30))) return;
      idle = 0;
      if (i < chunks.length && revives < 8) { revives += 1; speakNext(); return; }

    }, 800);

                          ${module === m.id ? 'bg-[#004030]/10 dark:bg-[#D8C3A5]/10 text-[#004030] dark:text-[#D8C3A5] font-bold'
                            : 'text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700'}`}>
                        <span className="shrink-0"><Icon size={16} /></span>
                        <span className="truncate">{m.nav}</span>
                      </button>
                    );
                  })}
                </div>
              )}
            </div>
            <button onClick={() => go(0)} aria-label={t.nav_home} className="p-2 hover:bg-white/10 rounded-lg"><IconHome size={18} /></button>
            <button onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })} className="flex items-baseline gap-2 min-w-0 px-1">
              <span className="font-serif font-black text-[#D8C3A5] text-lg tracking-widest shrink-0">{t.brand}</span>
              <span className="hidden sm:inline font-serif font-bold text-sm md:text-base truncate">{t.title}</span>
            </button>
          </div>
          <div className="flex items-center gap-1 shrink-0">
            <button onClick={() => handleTTS(ttsState === 'playing' ? 'pause' : 'play')} aria-label={t.audio_read}
              className="p-2 hover:bg-white/10 rounded-lg">{ttsState === 'playing' ? <IconPause size={17} /> : <IconPlay size={17} />}</button>
            {ttsState !== 'idle' && (
              <button onClick={() => handleTTS('stop')} aria-label="stop" className="p-2 hover:bg-white/10 rounded-lg"><IconSquare size={17} /></button>
            )}
            <button onClick={() => setLang(l => l === 'en' ? 'zh' : 'en')}
              className="px-2.5 py-1.5 text-xs font-bold hover:bg-white/10 rounded-lg">{lang === 'en' ? '中文' : 'EN'}</button>
            <button onClick={() => setIsDark(d => !d)} aria-label="theme" className="p-2 hover:bg-white/10 rounded-lg">
              {isDark ? <IconSun size={17} /> : <IconMoon size={17} />}
            </button>
          </div>
        </div>
      </header>

      <div className="flex-1 w-full max-w-7xl mx-auto flex gap-8 px-4 sm:px-6 py-8">
        <aside className="hidden md:block w-56 lg:w-64 shrink-0">
          <nav className="sticky top-24 space-y-1">
            {modules.map(m => {
              const Icon = MOD_ICON[m.id];
              return (
                <button key={m.id} onClick={() => go(m.id)}
                  className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-lg text-[13px] text-left transition-colors
                    ${module === m.id ? 'bg-[#004030] text-[#D8C3A5] font-bold'
                      : 'text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-800'}`}>
                  <span className="shrink-0"><Icon size={15} /></span>
                  <span className="truncate">{m.nav}</span>
                </button>
              );
            })}
          </nav>
        </aside>

        <main className="flex-1 min-w-0">
          {body}
          <div className="mt-12 flex justify-between items-center pt-8 border-t border-slate-300 dark:border-slate-700">
            <button onClick={() => go(Math.max(0, module - 1))} disabled={module === 0}
              className="px-4 py-2 text-sm font-bold text-[#004030] dark:text-[#D8C3A5] hover:underline disabled:opacity-0">← {t.nav_prev}</button>
            <button onClick={() => go(Math.min(TOTAL - 1, module + 1))} disabled={module === TOTAL - 1}
              className="px-4 py-2 text-sm font-bold text-[#004030] dark:text-[#D8C3A5] hover:underline disabled:opacity-0">{t.nav_next} →</button>
          </div>
        </main>
      </div>

      <footer className="h-8 bg-[#004030] flex items-center justify-between gap-2 px-3 sm:px-4 shrink-0">
        {/* 手機優先保留 Architect 連結；會被截掉的是版本與版權那一段 */}
        <span className="text-[#D8C3A5]/85 text-[10px] sm:text-xs truncate min-w-0">{t.date} · {t.copyright}</span>
        <span className="text-[#D8C3A5]/85 text-[10px] sm:text-xs flex items-center gap-2 sm:gap-3 shrink-0">
          <span className="whitespace-nowrap">
            <span className="hidden sm:inline">{t.architect_label}&nbsp;</span>
            <a href={t.architect_url} target="_blank" rel="noopener noreferrer" className="text-[#D8C3A5] hover:text-white underline">Prof. Shihmin Lo</a>
          </span>
          <button onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })} className="text-[#D8C3A5] hover:text-white font-bold whitespace-nowrap">Top ↑</button>
        </span>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
